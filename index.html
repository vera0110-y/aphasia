N.marta.M00=function(){last="M00";newSeg();narr("雨已经下了十四天。没有人记得它是什么时候开始的。墙根都泡软了，村长把一张盖了红印章的图纸钉在教堂门前的木板上，说从今天起，屋墙按图纸修。没有人去看那张图纸。");narr("黄昏没有完全落下。墙根积着一小片水，裂缝从窗框斜着爬到地面。");narr("玛尔塔蹲在墙边，掌心贴着砖面，像在听里面有什么东西慢慢醒来。");say("轻一点，墙。\n今晚要下雨。\n你别{pain:疼}得太响，屋里的人会睡不着。");newSeg();narr("这句话落在了一个你不熟悉的位置。");opts([{label:"【从墙开始调查】",special:true,action:function(){N.marta.hot("E01");}},{label:"“墙不会疼。”",action:function(){newSeg();you("墙不会疼。");say("城里人总爱替东西决定它们该不该疼。"," [信任 -1，稳定度 -2] ");addT(-1);addS(-2);addE("E01");N.marta.M01();}},{label:"“我能帮你修吗？”",action:function(){newSeg();you("我能帮你修吗？");say("先听听它到底伤在哪儿，再说修。"," [信任 +1] ");addT(1);addE("E01");addE("E08");N.marta.M01();}},{label:"（保持沉默）",action:function(){newSeg();narr("你什么也没说。玛尔塔继续摸着墙，不再解释。");addE("E01");N.marta.M01();}}]);};
N.marta.M01=function(){last="M01";newSeg();narr("旧屋不大。点中间的物件，或者和玛尔塔说话。");var o=[];var obs=[["E02","缺角的木椅","chair"],["E03","膝盖与药膏","knee"],["E04","门边的旧鞋","shoe"],["E09","桌上的旧茶壶","pot"],["E05","桌角的裂口陶杯","cup"],["E06","门后的新铁锤","hammer"]];obs.forEach(function(it){if(S.ev.indexOf(it[0])<0)o.push({label:"【观察】"+it[1],action:function(){N.marta[it[2]]();}});});var c=S.ev.filter(function(e){return e!=="E08"&&e!=="E10"&&e!=="E11";}).length;if(c>=4&&S.ev.indexOf("E10")<0)o.push({label:"【对话】玛尔塔放下手里的布，第一次正面看着你。",special:true,action:function(){N.marta.M06();}});if(["E01","E02","E03"].every(function(x){return S.ev.indexOf(x)>=0;})&&(S.ev.indexOf("E05")>=0||S.ev.indexOf("E06")>=0)&&!S.m5&&S.ev.indexOf("E10")>=0)o.push({label:"【事件】风变大了，墙后传来滴答声……",special:true,action:function(){N.marta.M05();}});if(S.diag==="accurate")o.push({label:"【继续】和玛尔塔一起修墙。",special:true,action:function(){N.marta.After();}});if(o.length===0)o.push({label:"（屋子里安静下来。）",disabled:true});opts(o);diagBtn();};
N.marta.hot=function(id){var m={E01:"wall",E02:"chair",E03:"knee",E04:"shoe",E05:"cup",E06:"hammer",E09:"pot"};if(m[id])N.marta[m[id]]();};
N.marta.wall=function(){last="wall";if(S.ev.indexOf("E01")>=0){newSeg();narr("你又看了一会儿墙。裂缝没有变。");N.marta.M01();return;}newSeg();narr("墙上的裂缝从窗框斜着爬到地面，边缘被反复摸过，发亮。墙根积着一小片水。");say("它{pain:疼}。水从后面来。");you("墙哪里疼？");say("裂在这里。你看不见吗？"," [信任 +1] ");addT(1);addE("E01");addN("N_wall_heidegger");narr("你看她补墙的手法。石头怎么摆，灰怎么抹，手很熟。熟得不像一个人练出来的。");say("这堵墙，我补了七次。");narr("她顿了顿。");say("前六次，是老石匠教的。第七次，是我自己补的。");narr("她没有说老石匠去哪儿了。你也没有问。");N.marta.M01();};
N.marta.chair=function(){last="chair";newSeg();narr("椅背被磨得发白，一条腿垫着折叠的旧布。它显然仍被每天使用。");say("别坐那张。\n它{pain:疼}得厉害，撑不了人的。");opts([{label:"“是因为椅腿裂了吗？”",action:function(){newSeg();you("是因为椅腿裂了吗？");say("嗯。裂了还要撑人，最疼。"," [信任 +1] ");addT(1);addE("E02");N.marta.M01();}},{label:"“它听得懂你说话？”",action:function(){newSeg();you("它听得懂你说话？");say("听不懂。疼又不一定要听得懂。");addE("E02");addN("N_chair_witt");N.marta.M01();}},{label:"“那换一张新的。”",action:function(){newSeg();you("那换一张新的。");say("新的没有这张稳。它只是伤了，不是没用了。");addE("E02");N.marta.M01();}},{label:"“你把它当人。”",action:function(){newSeg();you("你把它当人。");say("我把它当椅子。"," [信任 -1] ");addT(-1);addE("E02");N.marta.M01();}}]);};
N.marta.knee=function(){last="knee";newSeg();narr("药膏罐开着，气味很冲。她的膝盖确实肿着，但她已经不再挑水、不再搬重物。");you("你的膝盖也受伤了吗？");say("不{pain:疼}，只是老了。\n我不再挑水了，药自己上。\n它有人管，也不撑重了。");opts([{label:"“所以‘疼’不只是坏了，还得是没人管、还在撑着用？”",action:function(){newSeg();you("所以‘疼’不只是坏了，还得是没人管、还在撑着用？");say("你问到点子上了。坏了有人管，就不叫疼。叫修。"," [信任 +2] ");addT(2);addE("E03");addN("N_knee_heidegger");N.marta.M01();}},{label:"“可你还是不舒服。”",action:function(){newSeg();you("可你还是不舒服。");say("不舒服是我的事。疼是它的事。");addE("E03");addN("N_knee_merleau");N.marta.M01();}},{label:"“你在硬撑。”",action:function(){newSeg();you("你在硬撑。");say("你又在替我感觉了。"," [信任 -1] ");addT(-1);addE("E03");N.marta.M01();}}]);};
N.marta.shoe=function(){last="shoe";newSeg();narr("门边一双旧鞋，鞋底磨穿，却被缝补得很仔细。");say("鞋{pain:疼}，脚才走不远。\n别笑，这双鞋跟了我三十年。");opts([{label:"“鞋底磨穿了。”",action:function(){newSeg();you("鞋底磨穿了。");say("对。人踩着它走，它替人挨了那么多路。"," [信任 +1] ");addT(1);addE("E04");addN("N_shoe_levinas");N.marta.M01();}},{label:"“那你的脚疼吗？”",action:function(){newSeg();you("那你的脚疼吗？");say("脚累。鞋疼。话要分开说。");addE("E04");N.marta.M01();}},{label:"“旧东西都会疼？”",action:function(){newSeg();you("旧东西都会疼？");say("不。旧不是伤。桌上有只旧壶，好好的，就不疼。");addE("E04");N.marta.M01();}},{label:"“你舍不得扔。”",action:function(){newSeg();you("你舍不得扔。");say("舍不得和疼，是两回事。");addE("E04");addN("N_shoe_sartre");N.marta.M01();}}]);};
N.marta.pot=function(){last="pot";newSeg();narr("桌上一只旧茶壶，壶身完好，被擦得很亮。壶嘴有一道极细的旧痕，但早已修好。");say("这壶跟了我四十年。它不{pain:疼}。\n它没伤，也还在用。用得好好的。");opts([{label:"“所以旧不是疼的原因。”",action:function(){newSeg();you("所以旧不是疼的原因。");say("旧是旧。伤是伤。"," [信任 +1] ");addT(1);addE("E09");addN("N_pot_witt");N.marta.M01();}},{label:"“它旧了，总会坏。”",action:function(){newSeg();you("它旧了，总会坏。");say("会坏，和已经坏了，是两回事。");addE("E09");addN("N_pot_witt");N.marta.M01();}},{label:"“你舍不得它。”",action:function(){newSeg();you("你舍不得它。");say("舍不得是舍不得。疼是疼。");addE("E09");addN("N_pot_gadamer");N.marta.M01();}}]);};
N.marta.cup=function(){last="cup";newSeg();narr("一只新陶杯搁在桌角，杯沿有一道细裂。");say("小心那个杯子。新买的，口子裂了。\n它{pain:疼}得很，没人会留意它。");opts([{label:"“可它是新的。”",action:function(){newSeg();you("可它是新的。");say("新的伤口就不是伤口？");addE("E05");addN("N_cup_witt");N.marta.M01();}},{label:"“所以不是旧东西才会疼。”",action:function(){newSeg();you("所以不是旧东西才会疼。");say("你终于肯把话说完整了。"," [信任 +1] ");addT(1);addE("E05");addN("N_cup_witt");N.marta.M01();}},{label:"“它会觉得孤单吗？”",action:function(){newSeg();you("它会觉得孤单吗？");say("孤单是人的话。杯子只是裂了。");addE("E05");addN("N_cup_sartre");N.marta.M01();}},{label:"“扔掉就行。”",action:function(){newSeg();you("扔掉就行。");say("能扔。可扔之前，总该知道它伤在哪儿。"," [信任 -1] ");addT(-1);addE("E05");N.marta.M01();}}]);};
N.marta.hammer=function(){last="hammer";newSeg();narr("门后挂着一把新铁锤，锤面光亮，没有一道划痕。");say("这把锤子还好好的。\n没用过几回，也没伤。\n它不{pain:疼}。");opts([{label:"“因为它没有裂口。”",action:function(){newSeg();you("因为它没有裂口。");say("没有伤，也就没有疼。");addE("E06");N.marta.M01();}},{label:"“因为它没被人用过。”",action:function(){newSeg();you("因为它没被人用过。");say("用过也不一定疼。用坏了才疼。");addE("E06");N.marta.M01();}},{label:"“因为它没有生命。”",action:function(){newSeg();you("因为它没有生命。");say("椅子也没有。你又绕回去了。");addE("E06");N.marta.M01();}}]);};
N.marta.M06=function(){last="M06";newSeg();narr("玛尔塔放下手里的布，第一次正面看着你。");say("我问你一件事。\n你说{pain:疼}的时候，那个字在哪里？\n在你膝盖里？在脑子里？还是在你说话的那口气里？");opts([{label:"“在感觉里。我能感觉到它。”",action:function(){newSeg();you("在感觉里。我能感觉到它。");say("那你怎么知道别人也有？\n你只感觉到你自己的。"," [信任 +1] ");addT(1);addE("E10");addN("N_ask_where_witt");setTimeout(N.marta.M06a,400);}},{label:"“在用法里。我说‘疼’，别人知道该做什么。”",action:function(){newSeg();you("在用法里。我说‘疼’，别人知道该做什么。");say("那你和我，也差不多。"," [信任 +2] ");addT(2);addE("E10");addN("N_ask_where_witt");setTimeout(N.marta.M07,400);}},{label:"“在身体里。有神经，有损伤。”",action:function(){newSeg();you("在身体里。有神经，有损伤。");say("墙没有神经。可它有裂缝。\n裂缝和神经，哪个更疼？"," [信任 +1] ");addT(1);addE("E10");addN("N_ask_where_merleau");N.marta.M01();}},{label:"“我不知道。”",action:function(){newSeg();you("我不知道。");say("不知道就说不知道。比乱说强。"," [信任 +2] ");addT(2);addE("E10");addN("N_ask_where_witt");N.marta.M01();}}]);};
N.marta.M06a=function(){last="M06a";newSeg();narr("玛尔塔没有反驳。她只是继续问。");say("你说你感觉到疼。\n那你怎么知道，你感觉到的那个东西，\n和别人感觉到的，是同一个东西？\n你没法钻进别人身体里去看。");opts([{label:"“我们用的词一样，所以感觉应该一样。”",action:function(){newSeg();you("我们用的词一样，所以感觉应该一样。");say("词一样，感觉就一样？\n那我说‘疼’，你也说‘疼’，\n可我的疼是裂了没人管，你的疼是膝盖肿了。\n同一个词，两回事。"," [信任 +1] ");addT(1);setTimeout(N.marta.M07,500);}},{label:"“不需要知道。我说‘疼’，你递药给我，就够了。”",action:function(){newSeg();you("不需要知道。我说‘疼’，你递药给我，就够了。");say("对。够了。\n你看，你也会说我的话。"," [信任 +2] ");addT(2);setTimeout(N.marta.M07,500);}},{label:"“我可以描述我的感觉，描述得足够细。”",action:function(){newSeg();you("我可以描述我的感觉，描述得足够细。");say("你描述得再细，我听到的还是词。\n我永远只能听到你的词，听不到你的疼。");setTimeout(N.marta.M07,500);}}]);};
N.marta.M07=function(){last="M07";S.m7=true;newSeg();narr("玛尔塔从抽屉里拿出一个小木盒，摇了摇。里面有东西在轻轻响。");say("假设每个人都有一个盒子，盒子里有一只甲虫。\n谁也不能看别人的盒子，只能看自己的。\n我们都说盒子里的是‘甲虫’。\n可如果每个人盒子里装的东西都不一样呢？\n甚至，如果盒子里什么都没有呢？\n‘甲虫’这个词，还有用吗？");addE("E11");opts([{label:"“有用。用法一致，哪怕内容不同。”",action:function(){newSeg();you("有用。用法一致，哪怕内容不同。");say("你学得很快。\n那墙的‘疼’，和你的‘疼’，\n也可以是两个盒子里的两只甲虫。\n可我们还在用‘疼’这个词。用得好好的。"," [信任 +2] ");addT(2);addN("N_beetle_witt1");setTimeout(N.marta.M08,500);}},{label:"“没用。那这个词就是空的。”",action:function(){newSeg();you("没用。那这个词就是空的。");say("可我们还在用。用得好好的。\n空不空，不影响用。"," [信任 +1] ");addT(1);addN("N_beetle_witt2");setTimeout(N.marta.M08,500);}},{label:"“我的盒子里有甲虫，别人的我不知道。”",action:function(){newSeg();you("我的盒子里有甲虫，别人的我不知道。");say("那你凭什么说别人盒子里也有？");addN("N_beetle_witt2");N.marta.M01();}}]);};
N.marta.M08=function(){last="M08";newSeg();narr("玛尔塔把盒子收起来。你们一起看着那堵墙。");say("你想过没有——\n如果墙会说话，它第一句会说什么？");opts([{label:"“它会说‘我疼’。”",action:function(){newSeg();you("它会说‘我疼’。");say("那它和你就一样了。可它不会说。\n它只会裂。裂就是它的话。"," [信任 +1] ");addT(1);addN("N_wall_levinas");N.marta.M01();}},{label:"“它会说‘别碰我’。”",action:function(){newSeg();you("它会说‘别碰我’。");say("那是你的话，不是它的话。");N.marta.M01();}},{label:"“它不会说话。它只是墙。”",action:function(){newSeg();you("它不会说话。它只是墙。");say("对。它不说话。可它裂了。\n裂了，就是它在说。\n你听不听，是你的事。"," [信任 +2] ");addT(2);addN("N_wall_witt");N.marta.M01();}}]);};
N.marta.M05=function(){last="M05";S.m5=true;newSeg();narr("风变大了。墙后传来细小的滴答声。裂缝边缘变深，像正在慢慢张开。");say("听见了吗？\n它这回{pain:疼}得真厉害。\n可我一个人搬不动石灰。");opts([{label:"“先找裂缝源头，再补墙。”",action:function(){newSeg();you("先找裂缝源头，再补墙。");say("对。疼总有伤口。"," [信任 +2] ");addT(2);addE("E07");addE("E08");addN("N_repair_heidegger");N.marta.M01();}},{label:"“先安慰墙。”",action:function(){newSeg();you("先安慰墙。");say("安慰也许有用。但雨不会等。"," [信任 -1] ");addT(-1);addE("E07");addN("N_comfort_witt");N.marta.M01();}},{label:"“墙不会听见你。”",action:function(){newSeg();you("墙不会听见你。");say("我也不是说给墙听。"," [稳定度 -2] ");addS(-2);addE("E07");N.marta.M01();}},{label:"“我去拿石灰。”",action:function(){newSeg();you("我去拿石灰。");say("拿吧。别拿错那袋。");addE("E07");addE("E08");addN("N_repair_witt");N.marta.M01();}}]);};
N.marta.acc=function(){push(last);newSeg();S.diag="accurate";addS(8);S.trust=3;you("你说‘疼’，不是说墙像人一样受苦。\n你是在说：它裂了、坏了、还在被用，而没有人去照看它。");say("……");narr("她看着你，很久。然后她笑了。那笑很轻，像一块旧布被抖开。");say("你从城里来，倒没把耳朵落在城里。\n来，把石灰递给我。"," [稳定度 +8，信任设为3] ");addN("N_repair_heidegger");opts([{label:"【继续】和玛尔塔一起修墙。",special:true,action:function(){N.marta.After();}}]);diagBtn();};
N.marta.part=function(){push(last);newSeg();S.diag="partial";addS(3);you("你说‘疼’，是在说东西坏了。");say("差不多。\n可东西坏了，和它疼，不总是一回事。\n你要是只看见坏，修的时候就会下手太重。"," [稳定度 +3] ");narr("（诊断不完整。她似乎还在意：这东西是否仍被使用、是否需要被照料。）");opts([{label:"【就这样离开】\n（触发部分理解结局）",special:true,action:function(){finish("partial");}},{label:"【再想想】回到屋里继续观察。",action:function(){S.diag="none";S.ans={obj:null,feat:null,act:null};N.marta.M01();}}]);diagBtn();};
N.marta.ani=function(){push(last);newSeg();S.diag="misread";addS(-8);addT(-2);you("你觉得墙也会害怕，也会受苦。");say("我没这么说。\n你们总爱给东西塞进人的话，\n然后再说它们不像人。"," [稳定度 -8，信任 -2] ");narr("屋子里安静下来。之后，玛尔塔开始用她从未用过的说法。");say("门昨晚怕得没合上。\n碗不肯看我。");opts([{label:"【就这样离开】\n（触发泛灵误读结局）",special:true,action:function(){finish("animist");}},{label:"（走到陶杯前）“不是害怕。它只是裂了。”",action:function(){newSeg();you("不是害怕。它只是裂了。");say("……");opts([{label:"“我把你的话听成了我自己的话。”",special:true,action:function(){newSeg();you("我把你的话听成了我自己的话。");say("那就再听一遍。\n别急着给墙添一颗心。\n墙已经够难受了。"," [稳定度 +4] ");addS(4);opts([{label:"【重新诊断】",special:true,action:function(){S.diag="none";S.ans={obj:null,feat:null,act:null};N.marta.M01();}}]);}}]);}}]);diagBtn();};
N.marta.dis=function(){push(last);newSeg();S.diag="misread";addS(-12);S.trust=-3;you("你把墙当人，是因为你已经分不清了。");say("……");say("出去。"," [稳定度 -12，信任 -3] ");narr("她不再看你。屋子变得过分安静，连风都停了。");opts([{label:"【就这样离开】\n（触发贬抑误读结局）",special:true,action:function(){finish("dismissive");}},{label:"（不说话，把旧椅下的布递给她）",action:function(){newSeg();narr("你走到旧椅旁，抽出垫脚的布。没有说话，把布递给她。");say("你不必懂我。\n至少先别替我把话说完。"," [稳定度 +8，信任归零] ");addS(8);S.trust=0;opts([{label:"【重新诊断】",special:true,action:function(){S.diag="none";S.ans={obj:null,feat:null,act:null};N.marta.M01();}}]);}}]);diagBtn();};
N.marta.old=function(){push(last);newSeg();S.diag="partial";addS(-4);you("你觉得所有旧东西都会疼。");say("旧壶放了四十年，也没疼过。\n你看见年头，却没看见伤口。"," [稳定度 -4] ");narr("（旧不是疼。新也可能疼。关键在于损伤，而不是时间。）");opts([{label:"【就这样离开】\n（触发老旧误读结局）",special:true,action:function(){finish("old");}},{label:"【重新诊断】",action:function(){S.diag="none";S.ans={obj:null,feat:null,act:null};N.marta.M01();}}]);diagBtn();};
N.marta.After=function(){last="After";newSeg();narr("你们一起把石灰搬到墙边。玛尔塔每一步都说‘疼’，而你已经能听懂她在指什么。");say("你看，{pain:疼}不是非得喊出来。\n有些东西只是慢慢坏。\n等有人看见，才知道该怎么补。");narr("你走出门时，回头看了一眼。她蹲在墙边，掌心贴着新补的那块，像在听里面还有没有声音。");narr("门外还在下雨。雨不大，但没停。");opts([{label:"【完成章节】",special:true,action:function(){finish("accurate");}}]);};

/* 汉斯 */
N.hans.M00=function(){last="M00";newSeg();narr("雨停了三天，井水开始泛油光。村长说水没问题，还让人把井边的告示换了一张新的。告示钉上去的第二天，下游的树叶开始枯。没有人再说水的事。");narr("磨坊里的风带着麦芒的干燥气味。水轮在窗外飞转，汉斯站在磨盘旁边，手里攥着一把面粉。");if(G.cleared.marta){echo("你想起玛尔塔：坏了、还在用、没人管的，才叫疼。");}say("我知道这磨盘今天不对劲。我听到了碎石子的声音。");say("但我没摸过，所以我不‘知道’那石子到底卡在哪里。");opts([{label:"【从水轮开始调查】",special:true,action:function(){N.hans.hot("E01");}},{label:"“你既然听到了，为什么不知道？”",action:function(){newSeg();you("你既然听到了，为什么不知道？");say("听到的是声音，摸到的才是东西。声音能骗人，手不会。"," [信任 +1] ");addT(1);addE("E02");N.hans.M01();}},{label:"“那你直接去摸摸看啊。”",action:function(){newSeg();you("那你直接去摸摸看啊。");say("说得轻巧。万一摸坏了呢？我得先‘确定’它真的坏了。"," [稳定度 -2] ");addS(-2);addE("E02");N.hans.M01();}}]);};
N.hans.M01=function(){last="M01";newSeg();narr("磨坊里有很多东西值得看看。点中间的任何物件，或者继续和汉斯说话。");var o=[];var obs=[["E01","水轮","wheel"],["E03","面粉袋","flour"],["E04","账本","ledger"],["E05","井水","well"],["E06","助手","helper"]];obs.forEach(function(it){if(S.ev.indexOf(it[0])<0)o.push({label:"【观察】"+it[1],action:function(){N.hans[it[2]]();}});});if(S.ev.filter(function(e){return e!=="E07"&&e!=="E08"&&e!=="E10";}).length>=4&&S.ev.indexOf("E10")<0)o.push({label:"【对话】汉斯放下手里的活，第一次正视你的疑问。",special:true,action:function(){N.hans.M06();}});if(["E01","E02","E03"].every(function(x){return S.ev.indexOf(x)>=0;})&&(S.ev.indexOf("E05")>=0||S.ev.indexOf("E06")>=0)&&!S.m5&&S.ev.indexOf("E10")>=0)o.push({label:"【事件】人们聚集在磨坊门口……",special:true,action:function(){N.hans.M05();}});if(S.diag==="accurate")o.push({label:"【继续】和汉斯一起去检验源头。",special:true,action:function(){N.hans.After();}});if(o.length===0)o.push({label:"（磨坊里只剩下水轮的轰鸣。）",disabled:true});opts(o);diagBtn();};
N.hans.hot=function(id){var m={E01:"wheel",E03:"flour",E04:"ledger",E05:"well",E06:"helper",E02:"mill"};if(m[id]&&N.hans[m[id]])N.hans[m[id]]();};
N.hans.wheel=function(){last="wheel";if(S.ev.indexOf("E01")>=0){newSeg();narr("你又看了一会儿水轮。它转得很平稳。");N.hans.M01();return;}newSeg();narr("水轮在飞速旋转。汉斯说：“我知道它没问题，因为今天早上我亲耳听过了。”");say("它转得那么快，如果轴承坏了，我一定能听出来。");opts([{label:"“所以你只用听觉来证明它没问题？”",action:function(){newSeg();you("所以你只用听觉来证明它没问题？");say("听觉不够吗？它转动的声音非常顺滑。"," [信任 +1] ");addT(1);addE("E01");addN("N_water_plato");N.hans.M01();}},{label:"“但如果你听错了呢？”",action:function(){newSeg();you("但如果你听错了呢？");say("听错？我听这声音听了三十年。"," [稳定度 -2] ");addS(-2);addE("E01");addN("N_mill_descartes");N.hans.M01();}}]);};
N.hans.mill=function(){last="mill";newSeg();narr("磨盘发出刺耳的摩擦声。");say("我听到了，绝对有碎石子，但我还没来得及亲手去掏。");opts([{label:"“所以你还没摸过。”",action:function(){newSeg();you("所以你还没摸过。");say("对。没摸过，就不算知道。"," [信任 +1] ");addT(1);addE("E02");N.hans.M01();}},{label:"“听到就够了。”",action:function(){newSeg();you("听到就够了。");say("不够。声音会骗人。"," [稳定度 -1] ");addS(-1);addE("E02");N.hans.M01();}}]);};
N.hans.flour=function(){last="flour";newSeg();narr("助手搬来面粉袋。汉斯：“我知道这袋有五十斤，因为我看它装满了。”");say("你看这袋子鼓的，绝对装满了。不用上秤，我一看就知道。");opts([{label:"“可你没上秤称过，怎么知道？”",action:function(){newSeg();you("可你没上秤称过，怎么知道？");say("我看它的大小和重量对比，没问题的。"," [信任 +1] ");addT(1);addE("E03");addN("N_flour_witt");N.hans.M01();}},{label:"“你信助手吗？”",action:function(){newSeg();you("你信助手吗？");say("我不信他。我只信我自己看到的重量。"," [稳定度 -2] ");addS(-2);addE("E03");N.hans.M01();}},{label:"（拿起账本核对）",action:function(){newSeg();narr("你翻看了一下账本。账本上写着这袋是四十五斤。");say("那是助手写错了。我看的是实物，四十五就是五十。"," [信任 -1] ");addT(-1);addE("E03");N.hans.M01();}}]);};
N.hans.ledger=function(){last="ledger";newSeg();narr("账本上写着“收入三桶麦子”。汉斯：“我知道没算错，这是助手报给我的数。”");say("助手说多少就是多少。我签了字，就算是确认了。");opts([{label:"“你既然没算过，怎么算知道？”",action:function(){newSeg();you("你既然没算过，怎么算知道？");say("他是我助手，他量过就等同我量过。"," [信任 -1] ");addT(-1);addE("E04");addN("N_ledger_gettier");N.hans.M01();}},{label:"“那你自己去数一遍。”",action:function(){newSeg();you("那你自己去数一遍。");say("你倒是提醒我了，我该去库房看看。");addE("E04");N.hans.M01();}},{label:"“万一助手在骗你呢？”",action:function(){newSeg();you("万一助手在骗你呢？");say("他敢？借他十个胆子。"," [信任 +1] ");addT(1);addE("E04");addN("N_ledger_anscombe");N.hans.M01();}}]);};
N.hans.well=function(){last="well";newSeg();narr("井水很清澈。汉斯：“我知道这水能喝，我天天看它，它没变过色。”");say("你看这水，清亮得很。我在这打了三十年水，从来没见过它出问题。");if(G.notes.hans.indexOf("N_hans_echo_marta")<0&&G.notes.marta.indexOf("N_wall_heidegger")>=0){addN("N_hans_echo_marta");echo("你想起玛尔塔：一堵墙的裂缝，和一口井的油光，都在发出同一种要求——被看见。");}opts([{label:"“可有人说下游的树叶枯萎了。”",action:function(){newSeg();you("可有人说下游的树叶枯萎了。");say("那是听说的。我只相信我这双眼睛看到的井水。"," [信任 -1] ");addT(-1);addE("E05");addN("N_water_moore");N.hans.M01();}},{label:"“你测过水质吗？”",action:function(){newSeg();you("你测过水质吗？");say("水质？水就是水，还用测？"," [稳定度 -2] ");addS(-2);addE("E05");N.hans.M01();}},{label:"“如果水面没变色，但水里有毒呢？”",action:function(){newSeg();you("如果水面没变色，但水里有毒呢？");say("这……我只相信我看到的。"," [信任 +1] ");addT(1);addE("E05");addN("N_water_quine");narr("他说“我天天看它”的时候，眼睛没有看井。他看着井边的石沿。石沿上有一道旧刻痕，像有人用指甲划的。");say("我师父那年也说过这话。他说水没问题。后来井水出了问题，师父走了。");narr("他把井绳收上来，一圈一圈绕在手上。");N.hans.M01();}}]);};
N.hans.helper=function(){last="helper";newSeg();narr("助手正在推卸责任：“我听说村长说水有问题。”汉斯：“你‘知道’个屁！你连井边都没去过。”");say("他说他‘知道’？他连现场都没到过，他连水都没摸过，他凭什么说知道！");opts([{label:"“所以在你这里，‘知道’必须亲自在场？”",action:function(){newSeg();you("所以在你这里，‘知道’必须亲自在场？");say("废话。没亲手摸过，没亲眼看见，那叫‘听说’。"," [信任 +2] ");addT(2);addE("E06");addN("N_helper_witt");N.hans.M01();}},{label:"“你是在生气，还是真的在讲道理？”",action:function(){newSeg();you("你是在生气，还是真的在讲道理？");say("我是在讲道理。但我没办法不生气。"," [信任 +1] ");addT(1);addE("E06");N.hans.M01();}},{label:"“也许他听到的也是一种‘确证’。”",action:function(){newSeg();you("也许他听到的也是一种‘确证’。");say("我没否认。但我只信我自己验证过的确证。"," [稳定度 -1] ");addS(-1);addE("E06");addN("N_helper_freud");N.hans.M01();}}]);};
N.hans.M06=function(){last="M06";newSeg();narr("汉斯放下手里的活，第一次正面看着你。");say("我问你一件事。\n如果你听到别人说“水有问题”，你没亲眼见过。你算‘知道’吗？");opts([{label:"“不算。那只是听说。”",action:function(){newSeg();you("不算。那只是听说。");say("你看，你也是这么想的。那你为什么觉得我偏执？"," [信任 +2] ");addT(2);addE("E10");addN("N_water_plato");setTimeout(N.hans.M06a,400);}},{label:"“算。如果他是个诚实的人，我就知道。”",action:function(){newSeg();you("算。如果他是个诚实的人，我就知道。");say("所以你信人，我信我的手。我们不一样。"," [信任 +1] ");addT(1);addE("E10");setTimeout(N.hans.M06a,400);}}]);};
N.hans.M06a=function(){last="M06a";newSeg();say("你知道问题在哪吗？我信我的眼睛，但我这辈子只信自己的眼睛。可是现在，没人信我的眼睛了。");opts([{label:"“你要向人们证明，而不是自己确认。”",action:function(){newSeg();you("你要向人们证明，而不是自己确认。");say("证明？怎么证明？把我看到的告诉他们？"," [信任 +2] ");addT(2);setTimeout(N.hans.M05,500);}},{label:"“也许你该试着信任别人一次。”",action:function(){newSeg();you("也许你该试着信任别人一次。");say("信任？信任能当饭吃吗？"," [信任 +1] ");addT(1);setTimeout(N.hans.M05,500);}}]);};
N.hans.M05=function(){last="M05";S.m5=true;newSeg();narr("人们聚集在磨坊门口，要求汉斯给出确凿证据，证明水源没问题。");say("你们要证据？我亲眼看到的还不算证据吗？");opts([{label:"“你亲自去测试水质，拿数据给他们看。”",action:function(){newSeg();you("你亲自去测试水质，拿数据给他们看。");say("我去……我亲自去。"," [信任 +2] ");addT(2);addE("E07");addE("E08");addN("N_test_witt");N.hans.M01();}},{label:"“你告诉他们你看到的水很清澈。”",action:function(){newSeg();you("你告诉他们你看到的水很清澈。");say("没用，他们不信我的眼睛了。"," [稳定度 -2] ");addS(-2);addE("E07");N.hans.M01();}}]);};
N.hans.acc=function(){push(last);newSeg();S.diag="accurate";addS(8);S.trust=3;you("你说‘知道’，并不是说‘我听见了’或者‘我猜到了’。\n你是在说：‘我亲手验证过了，这是我的确证。’");say("……");narr("汉斯沉默了很久，看着自己的双手。");say("对。我的手验证过的，我才认。别的东西，我只是听着。"," [稳定度 +8，信任设为3] ");addN("N_test_witt");opts([{label:"【继续】和汉斯一起去修水轮。",special:true,action:function(){N.hans.After();}}]);diagBtn();};
N.hans.pow=function(){push(last);newSeg();S.diag="misread";addS(-8);addT(-2);you("你只是用‘知道’这个词来显示你比助手和人们更权威。");say("权威？我要是只想显示权威，我早就随便编个故事骗他们了！"," [稳定度 -8，信任 -2] ");opts([{label:"【就这样离开】\n（触发权力误读结局）",special:true,action:function(){finish("power");}},{label:"（把账本递给他）“那就用账本和行动证明。”",action:function(){newSeg();you("那就用账本和行动证明。");say("我……我这就去对账。"," [稳定度 +4] ");addS(4);opts([{label:"【重新诊断】",special:true,action:function(){S.diag="none";S.ans={obj:null,feat:null,act:null};N.hans.M01();}}]);}}]);diagBtn();};
N.hans.pas=function(){push(last);newSeg();S.diag="misread";addS(-12);S.trust=-3;you("你只是一个懒汉，只会等待别人给你结论。");say("我懒？我在磨坊干了三十年，你竟然说我懒？滚出去！"," [稳定度 -12，信任 -3] ");opts([{label:"【就这样离开】\n（触发被动误读结局）",special:true,action:function(){finish("passive");}},{label:"（站在门外不离开，等他冷静下来）",action:function(){newSeg();narr("你在门外站了很久，直到里面重新响起了磨盘的声音。");say("……你还在？进来吧。刚才是我太激动了。"," [稳定度 +8] ");addS(8);S.trust=0;opts([{label:"【重新诊断】",special:true,action:function(){S.diag="none";S.ans={obj:null,feat:null,act:null};N.hans.M01();}}]);}}]);diagBtn();};
N.hans.abs=function(){push(last);newSeg();S.diag="misread";addS(-10);you("你对‘知道’的要求太高了。你要的那种绝对真理，只有数学里才有。生活里没有。");say("可如果连自己亲眼看见、亲耳听到的都不算绝对真理……那我这三十年的磨坊，算什么？算幻觉吗？"," [稳定度 -10] ");opts([{label:"【就这样离开】\n（触发绝对真理误读结局）",special:true,action:function(){finish("absolute");}},{label:"“算生活。生活不需要绝对真理。”",action:function(){newSeg();you("算生活。生活不需要绝对真理。");say("生活……"," [稳定度 +4] ");addS(4);opts([{label:"【重新诊断】",special:true,action:function(){S.diag="none";S.ans={obj:null,feat:null,act:null};N.hans.M01();}}]);}}]);diagBtn();};
N.hans.ske=function(){push(last);newSeg();S.diag="misread";addS(-10);you("你开始怀疑一切。你连自己的眼睛和耳朵都不信了。那这磨坊里的一切，还有什么意义？");narr("汉斯呆立在原地，他的手在发抖。他试图去摸水轮，但又缩了回来。");say("如果连摸到的东西都可能是假的……那我知道个屁。"," [稳定度 -10] ");opts([{label:"【就这样离开】\n（触发彻底怀疑论结局）",special:true,action:function(){finish("skeptic");}},{label:"“不，你的手是真的，你的磨坊是真的。”",action:function(){newSeg();you("不，你的手是真的，你的磨坊是真的。");say("真的吗……"," [稳定度 +4] ");addS(4);opts([{label:"【重新诊断】",special:true,action:function(){S.diag="none";S.ans={obj:null,feat:null,act:null};N.hans.M01();}}]);}}]);diagBtn();};
N.hans.After=function(){last="After";newSeg();narr("汉斯亲自检查了水轮和磨盘，并把账本核对了一遍。他重新找回了‘知道’的定义。");say("你看，如果不去摸，不去看，不去算，我怎么可能知道这水轮到底怎么了。");narr("你走出磨坊时，水轮还在转。他站在磨盘旁边，手放在石面上，没有动。");narr("下游的树叶还在枯。井边的告示换了一张新的，没有人看。");opts([{label:"【完成章节】",special:true,action:function(){finish("accurate");}}]);};

/* 尤尔根 */
N.jurgen.M00=function(){last="M00";newSeg();narr("村长把修墙的图纸又钉到了铁匠铺。铁匠没有把图纸揭下来。他在图纸边上用炭笔写了两个字。从那天起，来铁匠铺的人少了一半。");narr("铁匠铺里热浪逼人。炉膛里的火舌舔着风箱口，火星子往上蹿，撞到房梁又落下来，像一场倒着下的雨。");narr("空气里是焦炭、铁锈和汗混在一起的味道。你站在门口，鞋底很快就烫了。");narr("尤尔根赤着上身，背上的肌肉随着锤子起落一鼓一鼓。他砸的不是什么规整的坯子，就是一块没有形状的铁。每砸五下，手腕转一个角度。");narr("墙上钉着一张图纸，盖着村长的印章，三长两短标得清清楚楚。图纸边角被人用炭笔写了两个大字：放屁。");if(G.cleared.hans){echo("你想起汉斯：只有亲手摸过的，才算是知道。尤尔根每砸五下换一次角度，也是同一种东西。");}say("又来了一个说教的。");say("村长让你来的？回去告诉他，他那破图纸打出来的东西，连柴都劈不动。");narr("他吐了口唾沫在铁砧边上，唾沫星子瞬间就干了。");opts([{label:"【观察】墙上的图纸",special:true,action:function(){N.jurgen.hot("E01");}},{label:"【观察】满地的废铁",special:true,action:function(){N.jurgen.hot("E02");}},{label:"【观察】熔炉边的酒壶",special:true,action:function(){N.jurgen.hot("E06");}},{label:"“我想看看你怎么打铁。”",action:function(){newSeg();you("我想看看你怎么打铁。");narr("他手上的锤子顿了顿，抬眼看你，像在掂量这句话的重量。");say("看？光看有什么用。");narr("他把锤子往你脚边一踢——没真踢到你，停在半尺外。");say("你行你上。打不出比这更好的，就闭嘴看我打。"," [信任 +1] ");addT(1);addE("E05");N.jurgen.M01();}},{label:"“村长的图纸是标准，你为什么不遵守？”",action:function(){newSeg();you("村长的图纸是标准，你为什么不遵守？");narr("锤子砸下去，铁砧嗡的一声长鸣。他慢慢转过头。");say("标准？");say("那是死人的规矩。活人得用活人的法子。"," [稳定度 -2] ");addS(-2);addE("E01");N.jurgen.M01();}},{label:"“你打出来的东西确实不一样。”",action:function(){newSeg();you("你打出来的东西确实不一样。");narr("他咧嘴笑了一下，牙上沾着煤灰。");say("不一样，还是不对？");narr("他等你回答，锤子悬在半空。");say("这俩词可差得远。"," [信任 +1] ");addT(1);addE("E02");N.jurgen.M01();}}]);};
N.jurgen.M01=function(){last="M01";newSeg();narr("铁匠铺里一片狼藉，也一片安静，只有炉火的噼啪声。你可以四处走动，看看那些散落的东西，或者继续跟他说话。");narr("尤尔根不催你。他回到铁砧前，又开始砸那块铁，五下，换角度，五下，换角度。");var o=[];var obs=[["E01","墙上的图纸","blue"],["E02","满地的废铁","scrap"],["E03","他的铁锤","hammer"],["E04","半成品的剑","half"],["E05","尤尔根的挑衅","taunt"],["E06","熔炉边的酒壶","jug"],["E07","墙角的涂鸦","graf"]];obs.forEach(function(it){if(S.ev.indexOf(it[0])<0)o.push({label:"【观察】"+it[1],action:function(){N.jurgen[it[2]]();}});});var c=S.ev.filter(function(e){return ["E01","E02","E03","E04","E06","E07"].indexOf(e)>=0;}).length;if(S.ev.indexOf("E05")>=0&&c>=2&&!S.done){S.done=true;o=[];o.push({label:"【对话】尤尔根放下铁锤，死死盯着你。",special:true,action:function(){N.jurgen.M02();}});}if(o.length===0)o.push({label:"（尤尔根看着你，等你说话。）",disabled:true});opts(o);diagBtn();};
N.jurgen.hot=function(id){var m={E01:"blue",E02:"scrap",E03:"hammer",E04:"half",E05:"taunt",E06:"jug",E07:"graf"};if(m[id])N.jurgen[m[id]]();};
N.jurgen.blue=function(){last="blue";newSeg();narr("你凑近图纸。纸是村子里少见的厚牛皮纸，边角被火燎得发脆。三长两短的尺寸标得一丝不苟，落款是村长的印章。");narr("旁边那行炭笔字却写得很用力：“放屁”。你几乎能想象他写这两个字时的表情。");say("村长定的规矩。三长两短。");narr("他学了一遍村长的腔调，学得惟妙惟肖，然后自己先笑了。");say("放他娘的屁。");opts([{label:"“那你觉得应该怎么打？”",action:function(){newSeg();you("那你觉得应该怎么打？");narr("他用锤子指了指炉子，又指了指自己的手。");say("我觉得？看铁，看火，看手感。铁告诉你它想成什么样。"," [信任 +1] ");addT(1);addE("E01");addN("N_rule_witt");N.jurgen.M01();}},{label:"“这是村子里传下来的经验。”",action:function(){newSeg();you("这是村子里传下来的经验。");narr("他哼了一声，把锤子往铁砧上一搁。");say("经验？这是村长的私心。他想怎么打就怎么打，还非说是祖宗传下来的。"," [稳定度 -2] ");addS(-2);addE("E01");addN("N_power_foucault");addN("N_ostensive");N.jurgen.M01();}},{label:"“规矩就是用来打破的。”",action:function(){newSeg();you("规矩就是用来打破的。");narr("他盯着你看了两秒，忽然笑了，笑得不太友善。");say("打破？你是来砸场子的，还是来说教的？"," [稳定度 -1] ");addS(-1);addE("E01");N.jurgen.M01();}}]);};
N.jurgen.scrap=function(){last="scrap";newSeg();narr("你蹲下去翻那堆废铁。断剑、残刀、半截枪头，形状一个比一个怪。");narr("可你随手捡起一把，刃口在火光里泛着冷白——你下意识用拇指蹭了一下，指腹立刻见了血。");narr("尤尔根在背后看着，没出声。");say("都是废品。没人要。");narr("他顿了顿。");say("不过它们能砍断村长那些破铜烂铁。");opts([{label:"“它们的形状不一样，但都很锋利。”",action:function(){newSeg();you("它们的形状不一样，但都很锋利。");narr("他把锤子换到左手，右手在裤子上蹭了蹭。");say("你懂个屁。这叫手感。"," [信任 +1] ");addT(1);addE("E02");addN("N_power_foucault");addN("N_family");N.jurgen.M01();}},{label:"“不合标准的，就是废铁。”",action:function(){newSeg();you("不合标准的，就是废铁。");narr("他脸上的笑一下子没了。");say("那你滚去用村长的废铁吧。"," [稳定度 -2] ");addS(-2);addE("E02");N.jurgen.M01();}},{label:"“既然都是废铁，那还有什么意义？”",action:function(){newSeg();you("既然都是废铁，那还有什么意义？");narr("他把锤子往地上一杵，火星从砧面上溅起来。");say("意义？意义能当饭吃？"," [稳定度 -2] ");addS(-2);addE("E02");addN("N_nihilism_heidegger");N.jurgen.M01();}}]);};
N.jurgen.hammer=function(){last="hammer";newSeg();narr("锤子靠在铁砧边。你伸手想拿，又缩回来——它比看上去沉得多。");narr("手柄被手汗浸成深褐色，五道划痕平行排列，深浅不一，最中间那道几乎刻穿了木头。");say("看什么呢。");narr("他走过来，把锤子拿在手里，很自然地掂了掂。");say("五下。我每打五下，就得换口气，换个角度。");say("这是我给自己定的。");if(G.notes.jurgen.indexOf("N_jurgen_echo_hans")<0&&G.notes.hans.indexOf("N_test_witt")>=0){addN("N_jurgen_echo_hans");echo("你想起汉斯：只有亲手摸过的，才算是知道。尤尔根的五下换角度，也是同一种东西。");}opts([{label:"“这是你自己给自己定的规矩？”",action:function(){newSeg();you("这是你自己给自己定的规矩？");narr("他看了你一会儿，眼神软了一点。");say("对。不然铁就死了。"," [信任 +2] ");addT(2);addE("E03");addN("N_practice_marx");addN("N_habitus");narr("你看着那五道划痕。深浅不一，最中间那道几乎刻穿了木头。");say("这五道，不是刻的。是烫的。");narr("他把锤柄翻了个面，不让你看。");say("那天铁匠铺着火，我师父没出来。我抓锤柄的时候，锤柄还是烫的。");N.jurgen.M01();}},{label:"“这不过是习惯而已。”",action:function(){newSeg();you("这不过是习惯而已。");narr("他摇头，摇得很慢。");say("习惯？没这个习惯，打出来的东西就废了。废铁你负责？"," [稳定度 -1] ");addS(-1);addE("E03");N.jurgen.M01();}},{label:"“你在炫耀你的辛苦。”",action:function(){newSeg();you("你在炫耀你的辛苦。");narr("他把锤子往肩上一扛，冷笑。");say("辛苦？辛苦不值钱。手底下见真章。"," [稳定度 -1] ");addS(-1);addE("E03");N.jurgen.M01();}}]);};
N.jurgen.half=function(){last="half";newSeg();narr("铁砧上横着一把打了一半的剑。剑身的弧度很怪，既不是直的，也不是弯的，像被人从中间拗了一下。");narr("你伸手比了比，它的重心落在一个说不出的位置。");say("这剑的规矩变了。");narr("他走过来，把剑拿起来对着火光看，眼睛眯成一条缝。");say("刚才还是三长两短，现在得改成四长一短。");if(G.notes.jurgen.indexOf("N_jurgen_echo_marta")<0&&G.notes.marta.indexOf("N_repair_heidegger")>=0){addN("N_jurgen_echo_marta");echo("你想起玛尔塔：坏的、还在用的、没人管的，才叫疼。这把半成品剑，也是“坏了、还在用、没人管”的东西。");}opts([{label:"“规矩不是固定的？”",action:function(){newSeg();you("规矩不是固定的？");narr("他把剑放回去，动作很轻，像放一件还没定下来的事。");say("铁在变，人也在变。规矩当然得变。"," [信任 +1] ");addT(1);addE("E04");addN("N_rule_witt");N.jurgen.M01();}},{label:"“你在找借口。”",action:function(){newSeg();you("你在找借口。");narr("他猛地回头，锤子在手里攥紧了，又慢慢松开。");say("你懂个屁。"," [稳定度 -2] ");addS(-2);addE("E04");N.jurgen.M01();}},{label:"“那到底哪一套才算数？”",action:function(){newSeg();you("那到底哪一套才算数？");narr("他愣了一下，好像这问题戳到了什么。");say("哪套算数……得看这把剑最后想成什么样。"," [信任 +1] ");addT(1);addE("E04");addN("N_silence_witt");N.jurgen.M01();}}]);};
N.jurgen.taunt=function(){last="taunt";newSeg();narr("他把手里那把巨大的铁锤踢到你脚下，锤头砸在地上，闷响一声，震得你脚心发麻。");narr("他抱着胳膊看你，炉火在他背后，把他的轮廓烧成一团黑影。");say("你行你上。");say("打不出比这更好的，就闭嘴看我打。");opts([{label:"（弯腰握住铁锤）“我试试。”",action:function(){newSeg();narr("你弯下腰，握住了那把沉甸甸的铁锤。锤柄还是温的。");narr("尤尔根愣了一下，随即嘴角咧开，露出一口沾着煤灰的牙。");say("你……还真敢。"," [信任 +2] ");addT(2);addE("E05");addN("N_shared_witt");N.jurgen.M01();}},{label:"“我不是来打铁的。”",action:function(){newSeg();you("我不是来打铁的。");narr("他撇了撇嘴，弯腰把锤子捡回去，动作里带着点失望。");say("那你来干嘛？看我笑话？"," [稳定度 -1] ");addS(-1);addE("E05");N.jurgen.M01();}},{label:"“打铁有什么意义？”",action:function(){newSeg();you("打铁有什么意义？");narr("他直起身，看了你很久，眼神里的火慢慢暗下去。");say("没意义。你走吧。"," [稳定度 -3] ");addS(-3);addE("E05");N.jurgen.M01();}}]);};
N.jurgen.jug=function(){last="jug";newSeg();narr("熔炉边搁着一只锡酒壶。壶身熏得发黑，摸上去还温着。");narr("你翻过来看壶底，歪歪扭扭刻着两个字：“给汉斯”。");narr("可你记得，磨坊主汉斯滴酒不沾。这在村子里不是秘密。");say("别看了。");narr("他走过来，不动声色地把壶翻了个面，刻字那面朝里。");say("我欠他的。");opts([{label:"“汉斯不喝酒，你知道。”",action:function(){newSeg();you("汉斯不喝酒，你知道。");narr("他没否认，只是看着炉火。");say("知道。可我打了一把好刀给他，他没用。刀还在我这儿。"," [信任 +1] ");addT(1);addE("E06");addN("N_form_life");addN("N_forms_life_plural");N.jurgen.M01();}},{label:"“他是不是欠你钱？”",action:function(){newSeg();you("他是不是欠你钱？");narr("他笑了，笑得有点苦。");say("钱？钱能算清。有些账算不清。"," [稳定度 -1] ");addS(-1);addE("E06");N.jurgen.M01();}},{label:"“你俩之间有矛盾。”",action:function(){newSeg();you("你俩之间有矛盾。");narr("他把酒壶往炉子边一推，壶底在铁皮上刮出一声刺耳的响。");say("矛盾。你们城里人真会说词儿。"," [稳定度 -1] ");addS(-1);addE("E06");N.jurgen.M01();}}]);};
N.jurgen.graf=function(){last="graf";newSeg();narr("墙角有一片炭笔涂鸦，笔迹稚嫩，是孩子画的。");narr("一个赤膊的铁匠，举着一把没有形状的剑。剑旁边歪歪扭扭写了两个字：“真的”。");narr("你看的时候，尤尔根顺着你的目光望过去，喉结动了一下，没说话。");say("莉娜画的。");narr("过了很久他才开口。");say("她说这剑是真的。我说它还没打完呢。她说没打完也是真的。");opts([{label:"“她说的‘真的’，跟我们说的不一样。”",action:function(){newSeg();you("她说的‘真的’，跟我们说的不一样。");narr("他转过头看你，眼神里有点意外。");say("……你听出来了？"," [信任 +2] ");addT(2);addE("E07");addN("N_form_life");narr("你看着涂鸦里那个铁匠。铁匠举着一把没有形状的剑，剑旁边写着“真的”。");say("我师父也会画。他画得比莉娜好。");narr("他低头，用脚尖蹭了蹭地上的煤灰。");say("他走的那天，这剑还没打完。");N.jurgen.M01();}},{label:"“小孩子不懂事，别当真。”",action:function(){newSeg();you("小孩子不懂事，别当真。");narr("他脸色沉下来，弯腰把涂鸦用脚蹭掉了一角，又停住，把手收回去。");say("她比你懂。"," [稳定度 -2] ");addS(-2);addE("E07");N.jurgen.M01();}},{label:"“你信她的话？”",action:function(){newSeg();you("你信她的话？");narr("他看着那两个字，看了很久。");say("我不知道。可她说的时候，我手里的铁好像真有点不一样。"," [信任 +1] ");addT(1);addE("E07");N.jurgen.M01();}}]);};
N.jurgen.M02=function(){last="M02";newSeg();narr("尤尔根放下铁锤，死死盯着你。炉火把他的脸劈成明暗两半，煤灰和旧疤在光里显得更深。");say("村长的图纸，全村人都在用。");narr("他从废铁堆里翻出两把剑，一把扔在你面前，一把握在自己手里。扔给你的那把，尺寸规整，三长两短，分毫不差；他手里那把，弧度古怪，刃口却白得发亮。");say("这把，按图纸打的。你试试。");narr("你握住那把规整的剑，往铁砧上一磕——剑身从中间断成两截，断口发灰。");say("这把，我打的。");narr("他把手里那把递给你。你随手一挥，铁砧边上那根铁条应声而断。");say("你觉得为什么？");opts([{label:"“因为图纸是强加的，大家并不真的懂。”",action:function(){newSeg();you("因为图纸是强加的，大家并不真的懂。");narr("他慢慢点头，点得很重。");say("对。他们只是照猫画虎。画得像，可不知道为什么要这样画。"," [信任 +2] ");addT(2);addE("E08");addN("N_power_foucault");addN("N_ostensive");setTimeout(N.jurgen.M03,400);}},{label:"“因为他们没按规矩来。”",action:function(){newSeg();you("因为他们没按规矩来。");narr("他冷笑一声，把手里的剑往废铁堆里一插。");say("规矩？屁的规矩！那是村长的规矩，不是我们的！"," [稳定度 -2] ");addS(-2);addE("E08");setTimeout(N.jurgen.M03,400);}},{label:"“因为你的规矩才是对的。”",action:function(){newSeg();you("因为你的规矩才是对的。");narr("他摇头，摇得很坚决。");say("我的规矩，只有我自己能守。别人学不来。"," [信任 +1] ");addT(1);addE("E08");addN("N_private_kripke");setTimeout(N.jurgen.M03,400);}}]);};
N.jurgen.M03=function(){last="M03";newSeg();narr("尤尔根把手伸到你面前。那是一只你不该在四十岁的人身上看到的手——指节粗大，掌心老茧叠着老茧，几道旧伤横着穿过。");say("你看我这手。");narr("他用拇指按了按掌心一块最厚的茧，像在按一块石头。");say("这茧子不是一天磨出来的。");say("规矩也是。");opts([{label:"“所以你的规矩，是一锤一锤砸出来的。”",action:function(){newSeg();you("所以你的规矩，是一锤一锤砸出来的。");narr("他把手收回去，握了握拳，又松开。");say("对。是身体记住的。不是写在纸上的。"," [信任 +2] ");addT(2);addE("E04");addN("N_body_merleau");setTimeout(N.jurgen.M04,400);}},{label:"“这不过是受罪罢了。”",action:function(){newSeg();you("这不过是受罪罢了。");narr("他把手猛地收回去，像被烫了一下。");say("受罪？你懂个屁。这是手艺。受罪的人多了，有几个能打出好剑？"," [稳定度 -2] ");addS(-2);addE("E04");setTimeout(N.jurgen.M04,400);}},{label:"“如果不用这样受苦，你还会守规矩吗？”",action:function(){newSeg();you("如果不用这样受苦，你还会守规矩吗？");narr("他想了想，想得很久。");say("不知道。也许不会。可我没得选。"," [信任 +1] ");addT(1);addE("E04");addN("N_practice_marx");addN("N_habitus");setTimeout(N.jurgen.M04,400);}}]);};
N.jurgen.M04=function(){last="M04";newSeg();narr("他捡起那把半成品的剑，重新放到铁砧上。火星在剑身上跳，像一群不肯落地的虫子。");say("现在，这剑的规矩是四长一短。");narr("他把锤子递到你手里，这次是认真地递，双手。");say("你打给我看。");opts([{label:"（按他的节奏，五下，换角度）",action:function(){newSeg();narr("你握紧锤子，心里默数：一下、两下、三下、四下、五下——手腕转了个角度，再砸。火星四溅。");narr("铁砧发出一声清亮的长鸣，剑身微微颤了一下，像是应了你。");narr("尤尔根盯着那把剑，喉结动了一下。");say("你……真打了。还打对了。"," [信任 +3] ");addT(3);addE("E05");addN("N_shared_witt");addN("N_body_merleau");setTimeout(N.jurgen.M04b,500);}},{label:"（用力猛砸三下，图快）",action:function(){newSeg();narr("你抡起锤子猛砸三下，火星炸开，剑身却发出一声沉闷的呜咽，弯了一个难看的角度。");narr("尤尔根伸手按住你的手腕。");say("停。铁在喊疼呢。"," [稳定度 -2] ");addS(-2);addN("N_silence_witt");setTimeout(N.jurgen.M04b,500);}},{label:"“我不会打铁。”",action:function(){newSeg();you("我不会打铁。");narr("他盯着你看了两秒，把锤子收回去，没嘲笑，也没说话。");say("那你就看着。看也是一种活儿。"," [稳定度 -1] ");addS(-1);setTimeout(N.jurgen.M04b,500);}},{label:"“你必须按村长的规矩打。”",action:function(){newSeg();you("你必须按村长的规矩打。");narr("他脸上的光一下子灭了。");say("那你就等着收废铁吧。"," [稳定度 -3] ");addS(-3);addE("E07");setTimeout(N.jurgen.M04b,500);}}]);};
N.jurgen.M04b=function(){last="M04b";newSeg();narr("炉火渐渐低下去，铁匠铺里暗了一截。尤尔根靠着铁砧坐下，从炉边摸出那只锡酒壶，拔开塞子闻了闻，又塞回去。");say("你知道我为啥每五下换一次角度吗。");narr("他没等你回答。");say("铁烧到某个火候，就会软，也会犟。五下是一个火候。第五下之后，它要是不肯顺着来，我就得换个方向问它。");say("这不是我定的。是铁定的。我只是听。");opts([{label:"“所以你是在听铁说话。”",action:function(){newSeg();you("所以你是在听铁说话。");narr("他把酒壶放下，笑了，这回笑得不苦。");say("差不多。铁有铁的脾气。你得先听，才能说。"," [信任 +2] ");addT(2);addN("N_rule_witt");addN("N_silence_witt");setTimeout(N.jurgen.M05,500);}},{label:"“那图纸上为什么没写这些？”",action:function(){newSeg();you("那图纸上为什么没写这些？");narr("他往炉子里啐了一口，火苗窜了一下。");say("写图纸的人没打过铁。他只会画。"," [信任 +1] ");addT(1);addN("N_power_foucault");addN("N_ostensive");setTimeout(N.jurgen.M05,500);}},{label:"“你在故弄玄虚。”",action:function(){newSeg();you("你在故弄玄虚。");narr("他看了你一眼，不再说了，低头去拨炉子里的炭。");say("行。你说什么就是什么。"," [稳定度 -1] ");addS(-1);setTimeout(N.jurgen.M05,500);}}]);};
N.jurgen.M05=function(){last="M05";S.m5=true;newSeg();narr("铁匠铺的门被粗暴地踹开。冷风灌进来，炉火猛地一歪。");narr("人们愤怒地冲进屋子，把几把断剑和折损的武器扔在地上，铁器相撞，声音刺耳。");narr("村长带着两个护卫走进来，脸上像挂了一层霜。");narr("一个人捡起断剑，指着尤尔根的鼻子。");narr("那人喊道：“你的规矩连狗屎都不如！这东西一砍就断！”");say("他们自己不会用，还怪我的剑有问题。");narr("尤尔根站着没动，声音不高。");say("规矩是死的，力气是活的。");narr("村长开口了：“从今天起，你必须严格按图纸打。否则，滚出村子。”");opts([{label:"“村长，让我来和尤尔根一起想办法。”",action:function(){newSeg();you("村长，让我来和尤尔根一起想办法。");narr("村长皱眉看你，人们也安静了一瞬。");narr("尤尔根侧过头，第一次用正眼看你，像重新掂量你这个人。");say("你？你算什么？"," [信任 +2] ");addT(2);addE("E07");addE("E08");addN("N_shared_witt");N.jurgen.M01();}},{label:"“尤尔根，你按图纸打一次试试。”",action:function(){newSeg();you("尤尔根，你按图纸打一次试试。");narr("他盯着你，眼神一点一点冷下去。");say("好。我打。"," [稳定度 -4] ");addS(-4);addE("E07");N.jurgen.M01();}},{label:"“规矩本来就可以灵活变通，大家自己看着办吧。”",action:function(){newSeg();you("规矩本来就可以灵活变通，大家自己看着办吧。");narr("人们哗然。村长脸色更难看了。尤尔根却笑了一声，笑得有点凉。");say("好。那就各打各的。"," [稳定度 -3] ");addS(-3);addE("E07");N.jurgen.M01();}},{label:"“村长，规矩毫无意义。全砸了吧。”",action:function(){newSeg();you("村长，规矩毫无意义。全砸了吧。");narr("满屋子的人都愣住了。尤尔根慢慢转过头看你，像在看一个陌生人。");say("你说什么？"," [稳定度 -6] ");addS(-6);addE("E07");N.jurgen.M01();}}]);};
N.jurgen.acc=function(){push(last);newSeg();S.diag="accurate";addS(8);S.trust=3;you("你说‘规矩’，不是说写在纸上的教条。\n你是在说：‘咱们一起这么干’。");narr("铁匠铺里安静下来，只有炉火还在响。");narr("尤尔根沉默了很久。他弯腰捡起那把被他扔在地上的半成品剑，用拇指沿着剑身摸了一遍。");narr("然后他把铁锤递给你——双手递的。");say("对。咱们一起这么干。"," [稳定度 +8，信任设为3] ");addN("N_shared_witt");narr("他扯下墙上的图纸，团成一团，扔进炉子。纸边卷起来，炭笔字在火里亮了一下，然后没了。");opts([{label:"【继续】和尤尔根一起重铸铁匠铺的规矩。",special:true,action:function(){N.jurgen.After();}}]);diagBtn();};
N.jurgen.rul=function(){push(last);newSeg();S.diag="misread";addS(-10);addN("N_tech_repro");you("你必须按图纸来。这是村长的命令。");narr("尤尔根没有争辩。他弯腰捡起图纸，用袖子把上面的炭笔字擦掉，擦得很用力，纸都磨破了。");say("好。我按。我全按。"," [稳定度 -10] ");narr("那天下午，他按图纸打了十二把剑，每一把都规整，每一把都一模一样。");narr("第二天，第一个人拿着这些剑去砍柴，剑刃像脆饼一样折断。有人受了伤。");narr("尤尔根还在打，五下，不换角度了。他打铁的样子像一台机器。");opts([{label:"【就这样离开】\n（触发规训误读结局）",special:true,action:function(){finish("rule_misread");}},{label:"“我们可以一起想个新办法。”",action:function(){newSeg();you("我们可以一起想个新办法。");narr("他手上的锤子停了。过了很久，他才开口。");say("新办法？……你还愿意想？"," [稳定度 +4] ");addS(4);opts([{label:"【重新诊断】",special:true,action:function(){S.diag="none";S.ans={obj:null,feat:null,act:null};N.jurgen.M01();}}]);}}]);diagBtn();};
N.jurgen.sol=function(){push(last);newSeg();S.diag="misread";addS(-8);addN("N_private_kripke");you("算了。规矩是你自己的事，我不管了。");narr("尤尔根愣了愣，随即咧嘴笑了，笑得不太正常。");say("好。那你走吧。"," [稳定度 -8] ");narr("你离开后的日子里，他打出的东西越来越怪：剑没有刃，刀柄长在刀尖上，铁器上刻满了只有他自己看得懂的划痕。");narr("没有人再找他打铁。他就一个人对着炉子说话，五下，换角度，五下，换角度。");opts([{label:"【就这样离开】\n（触发唯我论误读结局）",special:true,action:function(){finish("solipsism_misread");}},{label:"“不，我不该让你一个人。”",action:function(){newSeg();you("不，我不该让你一个人。");narr("他抬起头，眼睛里有血丝，也有点湿。");say("你……还回来？"," [稳定度 +4] ");addS(4);opts([{label:"【重新诊断】",special:true,action:function(){S.diag="none";S.ans={obj:null,feat:null,act:null};N.jurgen.M01();}}]);}}]);diagBtn();};
N.jurgen.nih=function(){push(last);newSeg();S.diag="misread";addS(-15);addN("N_nihilism_heidegger");you("根本没有规矩。一切都是虚假的。你打出来的东西，不过是一堆废铁。");narr("尤尔根站在原地，眼神一点一点涣散，像炉火被一盆水浇灭。");say("废铁……一切都是废铁……"," [稳定度 -15] ");narr("他举起铁锤，第一下砸在铁砧上，铁砧裂了；第二下砸在墙上，图纸碎了；第三下砸在炉门上，火星炸了一屋子。");narr("人们从此不再来。铁匠铺的烟囱再没冒过烟。");opts([{label:"【就这样离开】\n（触发虚无主义误读结局）",special:true,action:function(){finish("nihilist_misread");}},{label:"“不，你的手茧是真的。你打出的东西是有意义的。”",action:function(){newSeg();you("不，你的手茧是真的。你打出的东西是有意义的。");narr("他举着锤子的手停在半空，慢慢放下来，摊开手掌看着那些茧。");say("真的吗……"," [稳定度 +5] ");addS(5);opts([{label:"【重新诊断】",special:true,action:function(){S.diag="none";S.ans={obj:null,feat:null,act:null};N.jurgen.M01();}}]);}}]);diagBtn();};
N.jurgen.After=function(){last="After";newSeg();narr("接下来的三天，铁匠铺的炉火没灭过。");narr("尤尔根打铁，你递料，他每打五下，你就提醒他换角度。第三天傍晚，第一批新剑出了炉。");narr("人们围过来，半信半疑。尤尔根把一把剑递给最早骂他的那个人，没说话。");narr("那人犹豫着砍向柴堆——剑落下去，柴断成两截，剑身完好。");narr("人群里有人吹了声口哨。尤尔根咧嘴笑了，牙上还是沾着煤灰。");say("规矩，不是谁定的。");narr("他把锤子往铁砧上一搁，声音很响。");say("是咱们一起守出来的。");narr("墙角那片涂鸦还在。你走过去看，发现“真的”两个字旁边，多了一行新刻的划痕——五道，平行的。");narr("你走出铁匠铺时，炉火还亮着。他站在铁砧前，锤子搁在砧面上，没有拿起来。");narr("墙上的图纸被扯掉了，墙上留着一块比周围干净的方形。");opts([{label:"【完成章节】",special:true,action:function(){finish("accurate");}}]);};

/* 莉娜 */
N.lina.M00=function(){last="M00";newSeg();narr("孩子们开始模仿大人的说法。模仿得很快，模仿得不像。母亲们不再让孩子去石圈。她们说，听多了会学坏。石圈里的人一天少一个。");narr("村口的老椴树把影子拉得很长。影子尽头是一圈石头，石头围成的圆留着一道缺口，缺口正对着一条通往村外的小路。");narr("夕阳斜斜地穿过椴树叶，在孩子们脸上洒下一小片一小片抖动的光。空气里有干草和尘土的味道。");narr("莉娜坐在中间一块平石上，膝盖上摊着一本粗布缝成的“书”。她正讲到最要紧的地方，声音忽然低下去，像怕惊动了什么。");say("真的，昨天夜里，我看见月亮掉进井里了。");narr("一个孩子小声问：“真的吗？”她没有回答，只是笑，眼睛在余光里亮了一下，接着往下讲。");say("我把它捞上来。它在我手心里跳，凉的，像一块没晒过太阳的石头。然后整口井都变成银的了。");if(G.cleared.jurgen){echo("你想起尤尔根：规矩不是谁定的，是咱们一起守出来的。莉娜的故事圈，也是一种“一起守出来”的规矩。");}if(G.cleared.hans){echo("你想起汉斯：只有亲手验证过的，才算是知道。莉娜的“真的”不是汉斯意义上的“知道”，但它同样是一种被生活形式支撑的确信。");}if(G.cleared.marta){echo("你想起玛尔塔：坏的、还在用的、没人管的，才叫疼。莉娜的粉笔圆留着一道门，正如玛尔塔的墙留着一道裂缝。");}narr("她合上书，看着你。孩子们也转过头来。");say("大人也来听故事吗？");opts([{label:"【旁听】不出声，听她讲完。",special:true,action:function(){newSeg();narr("你没出声，往旁边退了一步，站在椴树的影子里。莉娜看了你一眼，继续讲，声音比刚才稳了一点。");say("……后来啊，月亮就在井里住下了。谁去打水，都得先跟它问个好。"," [信任 +1] ");addT(1);N.lina.M01();}},{label:"【打断】“你在撒谎，月亮不可能掉进井里。”",action:function(){newSeg();you("你在撒谎。月亮不可能掉进井里。");narr("孩子们一下子安静了。风从缺口灌进来，吹得粉笔灰打了一个旋。莉娜脸上的光暗了一格，像被谁悄悄拧小了一盏灯。");say("大人都是这样。"," [稳定度 -2] ");addS(-2);addE("E06");N.lina.M01();}},{label:"【观察】先看石圈和道具，不急着说话。",action:function(){newSeg();narr("你没说话，先蹲下去看地上那个不闭合的粉笔圆。莉娜注意到你的动作，没打扰你，只是把书往膝头按了按。");N.lina.M01();}},{label:"【加入】“那后来呢？”",action:function(){newSeg();you("那后来呢？");narr("莉娜眼睛一下子亮了，像捡到一颗别人都没看见的糖。");say("后来啊——后来月亮就赖在井里不肯走了。"," [信任 +2] ");addT(2);addE("E05");N.lina.M01();}}]);};
N.lina.M01=function(){last="M01";newSeg();narr("石圈里外都很安静。孩子们在等莉娜继续讲，她却在等你。椴树叶的影子在地上慢慢移，像一支很慢的钟。");narr("你可以四处看看，或者继续跟她说话。");var o=[];var obs=[["E01","石圈与粉笔圆","circle"],["E02","那本无字书","book"],["E03","缺口的陶碗","bowl"],["E04","一根羽毛","feather"],["E05","围坐的孩子们","kids"],["E06","莉娜本人","lina"],["E07","地上的字","writing"]];obs.forEach(function(it){if(S.ev.indexOf(it[0])<0)o.push({label:"【观察】"+it[1],action:function(){N.lina[it[2]]();}});});var c=S.ev.filter(function(e){return ["E01","E02","E03","E04","E06","E07"].indexOf(e)>=0;}).length;if(S.ev.indexOf("E05")>=0&&c>=2&&!S.done){S.done=true;o=[];o.push({label:"【对话】莉娜合上书，看着你。",special:true,action:function(){N.lina.M02();}});}if(o.length===0)o.push({label:"（莉娜看着你，等你说话。）",disabled:true});opts(o);diagBtn();};
N.lina.hot=function(id){var m={E01:"circle",E02:"book",E03:"bowl",E04:"feather",E05:"kids",E06:"lina",E07:"writing"};if(m[id])N.lina[m[id]]();};
N.lina.circle=function(){last="circle";newSeg();narr("粉笔画的圆不闭合，缺口正对石头围圈的那道缝。风从缺口进来，把粉笔灰吹散了一小撮。");narr("那不像画歪了——像故意留的门。孩子们坐在圈里，可谁都能从缺口走出去。");say("这是门。");narr("莉娜用脚尖点了点缺口。");say("讲故事的时候，门是开的。谁想进来就进来，谁想走就走。");if(G.notes.lina.indexOf("N_lina_echo_marta2")<0&&G.notes.marta.indexOf("N_wall_witt")>=0){addN("N_lina_echo_marta2");echo("你想起玛尔塔：墙不会说话，但它裂了，裂就是它的话。莉娜的门也一样——不说话，但开着。");}opts([{label:"“所以你的故事圈，是自愿进来的。”",action:function(){newSeg();you("所以你的故事圈，是自愿进来的。");narr("她点头，点得很认真，像在确认一件很重要的事。");say("对呀。故事不能关人。"," [信任 +1] ");addT(1);addE("E01");addN("N_lang_game");N.lina.M01();}},{label:"“你连圆都画不圆。”",action:function(){newSeg();you("你连圆都画不圆。");narr("她低头看了看那个缺口，不说话了，脚尖在粉笔线上蹭了蹭。");say("……我画得圆。"," [稳定度 -2] ");addS(-2);addE("E01");addN("N_development_piaget");N.lina.M01();}},{label:"“这个缺口是给谁留的？”",action:function(){newSeg();you("这个缺口是给谁留的？");narr("她歪头想了想，像在数一个看不见的名单。");say("给还没来的人。也给想走的人。"," [信任 +1] ");addT(1);addE("E01");N.lina.M01();}}]);};
N.lina.book=function(){last="book";newSeg();narr("你凑近那本“书”。粗布缝得很粗，针脚歪歪扭扭，上面全是炭笔划痕和涂鸦，没有一个真正的字。");narr("可莉娜一页一页翻得很认真，嘴里念着“从前啊……”，像在念一本真正的书。");say("这是我的书。");opts([{label:"“上面没有字。”",action:function(){newSeg();you("上面没有字。");narr("她把书抱到胸前，像护着什么怕被风吹走的东西。");say("有。我写的。你看不见而已。"," [信任 +1] ");addT(1);addE("E02");addN("N_make_believe");N.lina.M01();}},{label:"“你不识字，却装识字。”",action:function(){newSeg();you("你不识字，却装识字。");narr("她把书合上，塞到屁股底下坐着，眼睛看着别处。");say("我没装。我在写。"," [稳定度 -2] ");addS(-2);addE("E02");addN("N_private_lina");N.lina.M01();}},{label:"“你念给我听听。”",action:function(){newSeg();you("你念给我听听。");narr("她眼睛一亮，翻开一页，指着划痕念：“真的，有一天，风把整个村子吹到天上去了。”她停了一下，手指往后摸，摸到空白。");say("……后面还没写。"," [信任 +2] ");addT(2);addE("E02");N.lina.M01();}}]);};
N.lina.bowl=function(){last="bowl";newSeg();narr("一只缺了口的陶碗搁在石头上。刚才讲故事讲到国王时，莉娜把它扣在头顶当王冠，孩子们笑得前仰后合。");narr("现在碗又变回碗了，里面盛着几颗野果。");say("这是王冠。");narr("她看你盯着碗，补了一句。");say("讲完故事，它又是碗了。");opts([{label:"“道具的用处，由故事决定。”",action:function(){newSeg();you("道具的用处，由故事决定。");narr("她眨眨眼，好像没完全听懂，但还是点了点头。");say("反正它想当什么，就当什么。"," [信任 +1] ");addT(1);addE("E03");addN("N_make_believe");N.lina.M01();}},{label:"“破碗就是破碗，别当王冠。”",action:function(){newSeg();you("破碗就是破碗，别当王冠。");narr("她把碗从头顶拿下来，放回石头上，动作很轻，像放下一件不该被吵醒的东西。");say("……好。"," [稳定度 -2] ");addS(-2);addE("E03");N.lina.M01();}},{label:"“那它现在是碗，还是王冠？”",action:function(){newSeg();you("那它现在是碗，还是王冠？");narr("她想了想，把碗举起来对着光，缺口在夕阳里镶了一道金边。");say("看你在哪个故事里。"," [信任 +2] ");addT(2);addE("E03");N.lina.M01();}}]);};
N.lina.feather=function(){last="feather";newSeg();narr("一根灰白的羽毛插在石缝里，羽轴已经磨得发亮。你注意到，莉娜每次开口说“真的”之前，指尖都会在它上面停一停。");say("这是我的开关。");narr("她主动解释，手指在羽毛上捻了捻，像捻一根灯芯。");say("摸一下，故事就开始了。不摸，就是平常说话。");opts([{label:"“所以羽毛是进入游戏的开关。”",action:function(){newSeg();you("所以羽毛是进入游戏的开关。");narr("她用力点头，像终于有人听懂了她的母语。");say("对！你懂！"," [信任 +2] ");addT(2);addE("E04");addN("N_make_believe");addN("N_performative");N.lina.M01();}},{label:"“你有点不对劲。”",action:function(){newSeg();you("你有点不对劲。");narr("她把羽毛从石缝里拔出来，攥在手心，像攥着一根刺。");say("你什么意思？"," [稳定度 -1] ");addS(-1);addE("E04");addN("N_development_piaget");N.lina.M01();}},{label:"“不摸羽毛，你就不能讲故事了？”",action:function(){newSeg();you("不摸羽毛，你就不能讲故事了？");narr("她试了试，把手收回去，张了张嘴，又闭上。风从缺口进来，吹得羽毛在她手背上蹭了一下。");say("……不能。羽毛是门。"," [信任 +1] ");addT(1);addE("E04");N.lina.M01();}}]);};
N.lina.kids=function(){last="kids";newSeg();narr("四个更小的孩子围坐。莉娜说“真的”时，他们连呼吸都放轻；讲完，只问“然后呢”，没人问“这是真的吗”。");narr("一个最小的孩子偷偷把陶碗往自己头顶扣了一下，被旁边的人拍掉。");say("他们知道。");narr("莉娜看着他们，声音放轻，像怕把一层薄薄的东西碰碎。");say("我说“真的”，他们就知道要开始听了。");opts([{label:"“他们懂你的游戏规则。”",action:function(){newSeg();you("他们懂你的游戏规则。");narr("她笑了，露出一颗缺了的门牙。");say("对。他们不傻。"," [信任 +2] ");addT(2);addE("E05");addN("N_lang_game");addN("N_family_resemblance");N.lina.M01();}},{label:"“他们被你骗了。”",action:function(){newSeg();you("他们被你骗了。");narr("她的笑一下子没了。");say("我没骗。他们知道是故事。"," [稳定度 -2] ");addS(-2);addE("E05");N.lina.M01();}},{label:"“如果他们问‘真的吗’，你会怎么答？”",action:function(){newSeg();you("如果他们问“真的吗”，你会怎么答？");narr("她想了想，摇头。");say("他们不问。问了，就不是故事了。"," [信任 +1] ");addT(1);addE("E05");N.lina.M01();}}]);};
N.lina.lina=function(){last="lina";newSeg();narr("你仔细看莉娜。她讲故事时眼睛发亮，手舞足蹈，声音都换了腔调；一讲完，她立刻恢复平常，问孩子们“你们饿不饿”。");narr("像有人在她身体里开了一扇门，又轻轻关上。");say("你看我干嘛。");opts([{label:"“你能自由进出故事。”",action:function(){newSeg();you("你能自由进出故事。");narr("她愣了一下，然后有点得意地笑了，像被人说中了心事。");say("当然。故事是我的。我想进就进，想出就出。"," [信任 +2] ");addT(2);addE("E06");addN("N_lang_game");addN("N_form_life_lina");N.lina.M01();}},{label:"“你讲故事的时候，像另一个人。”",action:function(){newSeg();you("你讲故事的时候，像另一个人。");narr("她歪头，认真想了想。");say("那是我啊。讲故事的我，也是我。"," [信任 +1] ");addT(1);addE("E06");N.lina.M01();}},{label:"“你是不是有点不正常？”",action:function(){newSeg();you("你是不是有点不正常？");narr("她不笑了，低头去抠石头缝里的青苔，抠了很久。");say("……大人总这么说。"," [稳定度 -2] ");addS(-2);addE("E06");addN("N_development_piaget");N.lina.M01();}}]);};
N.lina.writing=function(){last="writing";newSeg();narr("粉笔圆旁边有一排她画的“字”，其实是画：一道横，一个圈，一道竖。她指着它们说“这是我写的”。");narr("你凑近看，一个真正的字也没有，可那些画有它们自己的次序。");say("这是“真的”。");narr("她指着其中一组画。");say("这个，是“故事”。");opts([{label:"“你在玩‘写字’的游戏。”",action:function(){newSeg();you("你在玩“写字”的游戏。");narr("她眼睛一亮，抓起粉笔。");say("对！我写给你看！"," [信任 +2] ");addT(2);addE("E07");addN("N_performative");N.lina.M01();}},{label:"“这不是字，你在冒充识字。”",action:function(){newSeg();you("这不是字，你在冒充识字。");narr("她一脚把那些画蹭掉了一半，粉笔灰在夕阳里浮起来。");say("……你不懂。"," [稳定度 -2] ");addS(-2);addE("E07");addN("N_private_lina");N.lina.M01();}},{label:"“那‘真的’和‘故事’，哪个先写？”",action:function(){newSeg();you("那“真的”和“故事”，哪个先写？");narr("她认真想了想，用粉笔在地上先画了一道横。");say("先写“真的”。写了它，才能开始。"," [信任 +1] ");addT(1);addE("E07");N.lina.M01();}}]);};
N.lina.M02=function(){last="M02";newSeg();narr("莉娜合上书，看着你。孩子们也转过头来，脸上的光一小片一小片地晃。");say("你也来讲一个吧。");narr("她把手里的羽毛递向你，羽轴在夕光里泛着一点旧金色。");say("摸一下，就可以开始了。");opts([{label:"讲一个真实发生的事：“我今天从村口走到这里，路上看见一只鸡。”",action:function(){newSeg();you("我今天从村口走到这里，路上看见一只鸡。");narr("莉娜认真听完，点点头。");say("然后呢？");narr("你愣住了——她把真实也当成了故事的开头。");say("……没有然后了。"," [信任 +1] ");addT(1);addE("E05");setTimeout(N.lina.M03,400);}},{label:"进入她的游戏：“真的，我今天看见一只鸡把太阳啄了个洞。”",action:function(){newSeg();you("真的，我今天看见一只鸡把太阳啄了个洞。");narr("莉娜眼睛一下子亮了，往前探身，辫梢扫过石面。");say("那太阳漏光了吗？"," [信任 +2] ");addT(2);addE("E08");addN("N_performative");setTimeout(N.lina.M03,400);}},{label:"拒绝：“我不想讲故事，我想问你问题。”",action:function(){newSeg();you("我不想讲故事，我想问你问题。");narr("她收敛笑容，把羽毛收回去，插回石缝。");say("大人都是这样。"," [信任 -1] ");addT(-1);setTimeout(N.lina.M03,400);}},{label:"测试她：“你说‘真的’的时候，是真的吗？”",action:function(){newSeg();you("你说“真的”的时候，是真的吗？");narr("她歪头看你，像看一个问错了题的学生。");say("你问得不对。"," [信任 +1] ");addT(1);addE("E09");addN("N_lang_game");setTimeout(N.lina.M03,400);}}]);};
N.lina.M03=function(){last="M03";newSeg();narr("莉娜忽然坐直了，伸手摸了一下石缝里的羽毛。夕阳正好落到椴树梢上，光一寸一寸往下退。");say("真的，我看见一只鸟把太阳叼走了，天就黑了。");narr("孩子们安静下来，连那个最小的也不动了。");say("然后我把太阳从鸟嘴里抢回来，放回天上。");narr("她讲完，看着你。椴树叶的影子在她脸上晃了一下。");say("你信吗？");opts([{label:"“我信。”",action:function(){newSeg();you("我信。");narr("她笑了，笑得有点狡黠。");say("你骗人。你根本不信。");narr("但她没有生气，反而往前凑了凑。");say("不过没关系。假装相信，也是故事的一部分。"," [信任 +2] ");addT(2);addE("E10");addN("N_make_believe");setTimeout(N.lina.M04,500);}},{label:"“我不信，但我喜欢这个故事。”",action:function(){newSeg();you("我不信，但我喜欢这个故事。");narr("莉娜想了想，很认真地点了点头，像在称一件东西的分量。");say("那你是在听故事，不是在听真的。");say("这两个不一样。"," [信任 +2，稳定度 +2] ");addT(2);addS(2);addE("E10");addN("N_make_believe");addN("N_family_resemblance");setTimeout(N.lina.M04,500);}},{label:"“鸟不可能叼走太阳，你在胡说。”",action:function(){newSeg();you("鸟不可能叼走太阳，你在胡说。");narr("她沉默了一会儿，把羽毛从石缝里拔出来，攥在手心，指节有点发白。");say("大人都是这样。"," [稳定度 -3] ");addS(-3);addE("E10");setTimeout(N.lina.M04,500);}},{label:"“这个故事有什么意义？”",action:function(){newSeg();you("这个故事有什么意义？");narr("她困惑地皱起眉，像第一次遇到有人问这种问题。");say("意义？故事就是故事啊。");narr("她低头看了看手里的羽毛，又抬头。");say("……没有意义。就是好玩。"," [稳定度 -2] ");addS(-2);addE("E10");addN("N_narrative_lyotard");setTimeout(N.lina.M04,500);}}]);};
N.lina.M04=function(){last="M04";newSeg();narr("一个村民母亲冲进石圈，一把拉起自己的孩子，力气大得孩子踉跄了一下。");narr("“别听她胡说！她说的都是假的！”");narr("莉娜第一次沉默。她低头摸那根羽毛，指尖在上面来回蹭，没反驳。");narr("孩子被拉得踉跄了一下，回头看了莉娜一眼，嘴唇动了动，没出声。");opts([{label:"对母亲说：“她没有骗人，她在讲故事。”",action:function(){newSeg();you("她没有骗人，她在讲故事。");narr("母亲半信半疑，手松了一点。");narr("莉娜抬头看你，眼神不同了，像第一次有人替她把一扇门推开。");say("……你替我说了。"," [信任 +2，稳定度 +2] ");addT(2);addS(2);addE("E11");addN("N_form_life_lina");addN("N_performative");setTimeout(N.lina.M05,500);}},{label:"对莉娜说：“你以后别对小孩子说‘真的’了。”",action:function(){newSeg();you("你以后别对小孩子说“真的”了。");narr("莉娜沉默更久，久到椴树叶的影子又移了一寸，然后轻轻说了一个字。");say("好。"," [稳定度 -3] ");addS(-3);addE("E11");addN("N_discipline_lina");setTimeout(N.lina.M05,500);}},{label:"对母亲说：“孩子们自己分得清。”",action:function(){newSeg();you("孩子们自己分得清。");narr("母亲更生气了：“分得清？他们才多大！”她拉着孩子走了，头也不回。莉娜看着他们的背影。");say("……他们分得清。"," [稳定度 -2] ");addS(-2);addE("E11");addN("N_private_lina");setTimeout(N.lina.M05,500);}},{label:"不说话，观察莉娜的反应。",action:function(){newSeg();narr("你没说话。母亲拉着孩子走了，石圈里空出一个位置。");narr("莉娜等他们走远，才转头看你。");say("你为什么不说话？"," [信任 -1] ");addT(-1);addE("E11");setTimeout(N.lina.M05,500);}}]);};
N.lina.M05=function(){last="M05";S.m5=true;newSeg();narr("村长带着两个护卫来到老椴树下。孩子们往后缩了缩，像一群被风惊动的麻雀。");narr("“有人说你撒谎成性，带坏小孩。”");narr("“从今天起，不许你在村口讲故事。”");narr("莉娜站起来，第一次用很大的声音说话，声音在椴树底下撞了一下。");say("我没有撒谎！");say("我说“真的”的时候，是在讲故事！");narr("她说完，自己愣了一下，好像也意识到这句话在大人听来像什么。");opts([{label:"“村长，她说的‘真的’和我们说的不一样。她是在邀请孩子进入故事。”",action:function(){newSeg();you("村长，她说的“真的”和我们说的不一样。她是在邀请孩子进入故事。");narr("村长犹豫了。莉娜看你，眼睛亮得吓人。");say("……你懂。"," [信任 +2，稳定度 +2] ");addT(2);addS(2);addE("E12");addN("N_form_life_lina");N.lina.M01();}},{label:"“村长说得对，你以后不许再说‘真的’。”",action:function(){newSeg();you("村长说得对，你以后不许再说“真的”。");narr("莉娜低头，把羽毛从石缝里拔出来，攥在手里，攥得很紧。");say("……好。"," [稳定度 -4] ");addS(-4);addE("E12");addN("N_discipline_lina");N.lina.M01();}},{label:"“孩子们喜欢听，就让她讲吧。”",action:function(){newSeg();you("孩子们喜欢听，就让她讲吧。");narr("村长更生气：“喜欢？喜欢就能胡说？”");narr("莉娜看着你们，没说话，把书往膝头按了按。");say("……"," [稳定度 -3] ");addS(-3);addE("E12");N.lina.M01();}},{label:"“故事没有意义，讲不讲都一样。”",action:function(){newSeg();you("故事没有意义，讲不讲都一样。");narr("莉娜猛地抬头看你，像被扇了一巴掌。椴树叶的影子在她脸上停住了。");say("……你说什么？"," [稳定度 -6] ");addS(-6);addE("E12");addN("N_narrative_lyotard");N.lina.M01();}}]);};
N.lina.acc=function(){push(last);newSeg();S.diag="accurate";addS(8);S.trust=3;you("你说“真的”，不是在判断真假。\n你是在说：‘来，一起假装’。");narr("莉娜盯着你看了很久。夕阳从椴树梢上滑下去，石圈里的光暗了一档，她的眼睛却亮着。");narr("然后她慢慢笑了。");say("对。就是这样。");narr("她站起来，走到粉笔圆旁边，把那个缺口补上了一小段，又停住，留了一道小口。");say("门还是要留着的。");addN("N_lang_game");addN("N_form_life_lina");narr("她转向村长，用大人的话又说了一遍：");say("村长，我说“真的”的时候，是开始讲故事。");narr("村长皱着眉，但没打断她。");opts([{label:"【继续】帮她把话说给全村人听。",special:true,action:function(){N.lina.After();}}]);diagBtn();};
N.lina.lie=function(){push(last);newSeg();S.diag="misread";addS(-10);addN("N_discipline_lina");you("你在撒谎。以后不许再说“真的”。");narr("莉娜没有争辩。她把羽毛、陶碗、无字书都收进一个布袋，埋在椴树下。土盖上去的时候，她拍得很平，像在拍一个睡着的人。");say("好。我不说了。"," [稳定度 -10] ");narr("孩子们来问她为什么不讲了。");say("大人说那是假的。");narr("她学会了大人的词。从那以后，她再没在村口讲过故事。");opts([{label:"【就这样离开】\n（触发谎言误读结局）",special:true,action:function(){finish("lie_misread");}},{label:"“等等，我不是要你闭嘴，我是想听懂你。”",action:function(){newSeg();you("等等，我不是要你闭嘴，我是想听懂你。");narr("她从树下抬起头，眼睛红红的。");say("……真的？"," [稳定度 +4] ");addS(4);opts([{label:"【重新诊断】",special:true,action:function(){S.diag="none";S.ans={obj:null,feat:null,act:null};N.lina.M01();}}]);}}]);diagBtn();};
N.lina.def=function(){push(last);newSeg();S.diag="misread";addS(-8);addN("N_development_piaget");you("你分不清现实和想象。这不是坏事，但得治。");narr("村子里请来了一个医生，给莉娜做测试：一张卡片画着苹果，一张画着月亮，问她哪个是真的。");narr("她全答对了。");narr("可从那天起，她讲故事之前会先停一下，像在检查自己。");say("我现在知道什么是真的了。"," [稳定度 -8] ");narr("她说这话的时候，眼睛不亮了，像一盏灯被人从里面罩上了。");opts([{label:"【就这样离开】\n（触发认知缺陷误读结局）",special:true,action:function(){finish("deficit_misread");}},{label:"“不，你不是有病。你只是会两种说话方式。”",action:function(){newSeg();you("不，你不是有病。你只是会两种说话方式。");narr("她抬头看你，像第一次听见这种说法。");say("……两种？"," [稳定度 +5] ");addS(5);opts([{label:"【重新诊断】",special:true,action:function(){S.diag="none";S.ans={obj:null,feat:null,act:null};N.lina.M01();}}]);}}]);diagBtn();};
N.lina.nih=function(){push(last);newSeg();S.diag="misread";addS(-15);addN("N_narrative_lyotard");you("故事没有意义。真假都一样。别讲了。");narr("莉娜愣住，然后把羽毛、陶碗、无字书全都扔进火里。羽毛卷起来，一瞬间就没了。");say("那就不讲了。"," [稳定度 -15] ");narr("孩子们散了。老椴树下空了很久，只有粉笔圆还在，慢慢被雨冲淡。");narr("几天后，你看见莉娜在村口，对着一群更小的孩子说：");say("真的，什么都没有。");narr("孩子们哭了。");opts([{label:"【就这样离开】\n（触发虚无主义误读结局）",special:true,action:function(){finish("nihilist_misread");}},{label:"“不，故事是有意义的。你讲的故事，有人记得。”",action:function(){newSeg();you("不，故事是有意义的。你讲的故事，有人记得。");narr("她看着你，眼泪在眼眶里打转，没掉下来。");say("……谁记得？"," [稳定度 +5] ");addS(5);opts([{label:"【重新诊断】",special:true,action:function(){S.diag="none";S.ans={obj:null,feat:null,act:null};N.lina.M01();}}]);}}]);diagBtn();};
N.lina.After=function(){last="After";newSeg();narr("那天傍晚，莉娜站在石圈中央，当着村长和人们的面，讲了一个故事。");narr("她先说：“这不是真的，这是一个故事。”然后才开始讲。椴树叶的影子在她脚边慢慢移。");narr("孩子们听得入神。大人们先是皱眉，后来有人笑了，笑得很轻，像怕惊动什么。");narr("村长没再说什么，转身走了。");narr("莉娜讲完，跑到你面前，把羽毛塞进你手里。羽轴还带着她的体温。");say("下次你来，我讲一个真的故事给你听。");narr("你注意到，她说“真的故事”的时候，没有一点犹豫。");narr("你走出石圈时，天已经黑了。孩子们散了，她一个人坐在平石上，膝盖上摊着那本粗布书。");narr("椴树的影子把她整个人盖住了。");opts([{label:"【完成章节】",special:true,action:function(){finish("accurate");}}]);};

/* 终局 */
N.final.M00=function(){
  last="M00";newSeg();
  if(!S.finalIntroShown){
    S.finalIntroShown=true;
    narr("四段诊断结束之后，广场中央多了一个人。没有人知道他是哪天站到那里去的。人们绕着他走，绕得很自然，像绕过一棵早就长在那里的树。");
    narr("广场比玛尔塔的屋子大，比铁匠铺空。正中央立着一块石板，齐胸高，表面被雨水和风磨得发灰。");
    narr("石板前站着一个人，背对着你。他不高，也不瘦。穿一件洗得发白的旧袍子，袖口磨出了毛边。");
    narr("他不看任何人，也不动。风从广场穿过，他的衣角动了一下，又垂下去。");
    narr("有一个孩子跑过来，在离他三步远的地方停住，绕了个弯，又跑开了。孩子没有看他。孩子绕得很自然，像绕过一棵树、一口井、一件早就摆在那里的东西。");
  }

    o.push({label:"“你怎么了？”",action:function(){
      push(last);newSeg();you("你怎么了？");
      narr("声音落下去，像石子掉进深井。没有回响。");
      narr("他没有转头。");
      narr("风又吹了一下。石板上的薄灰被扫出一道浅浅的弧，像有人用手指划过，又抹平了。");
      narr("你等了一会儿。你发现自己还在等。你不知道在等什么。");
      S.finalAsked=true;
      addS(-1);N.final.M00();
    }});

  }
  if(G.cleared.marta)o.push({label:S.finalEchoUsed.marta?"（已用玛尔塔的“疼”说过话）":"用玛尔塔的“疼”对他说话",disabled:!!S.finalEchoUsed.marta,action:function(){
    push(last);newSeg();you("墙在疼。你这里，也有什么东西在疼吗？");
    S.finalEchoUsed.marta=true;
    narr("他的肩动了一下。很轻，像一根绷紧的弦被风碰了一下。");
    narr("但他没有转头。");
    narr("你忽然明白：他听懂了。他只是没有可以回应的游戏。");
    narr("疼需要一个可以照料的对象。他听懂了疼，可他没有地方放它。");
    addN("N_silent_echo_marta");
    echo("【回响 · 疼在语言之外】玛尔塔的‘疼’要求被照料。沉默者的‘疼’没有可以照料的对象。他听懂了，但他没有地方放它。");
    N.final.M00();
  }});
  if(G.cleared.hans)o.push({label:S.finalEchoUsed.hans?"（已用汉斯的“我知道”说过话）":"用汉斯的“我知道”对他说话",disabled:!!S.finalEchoUsed.hans,action:function(){
    push(last);newSeg();you("我知道你在这里。我亲手摸过这些石板，我知道它们是凉的。");
    S.finalEchoUsed.hans=true;
    narr("他的手抬了一下，又放下。");
    narr("他没有转头。");
    narr("你知道他听见了。但“知道”在他这里，没有落脚的地方。");
    narr("知道需要一双可以验证的手。他验证过一切，然后停下了。知道得太多，也会让人说不出话。");
    addN("N_silent_echo_hans");
    echo("【回响 · 知道在语言之外】汉斯的‘我知道’要求亲手验证。沉默者验证过一切，然后停下了。知道得太多，也会让人说不出话。");
    N.final.M00();
  }});
  if(G.cleared.jurgen)o.push({label:S.finalEchoUsed.jurgen?"（已用尤尔根的“规矩”说过话）":"用尤尔根的“规矩”对他说话",disabled:!!S.finalEchoUsed.jurgen,action:function(){
    push(last);newSeg();you("刻石板也有规矩吧。你每刻几刀，换一次手？");
    S.finalEchoUsed.jurgen=true;
    narr("他的手指在袍子侧面轻轻敲了一下。五下。停住。");
    narr("然后他把手收回袖子里。");
    narr("他没有转头。但他敲的那五下，你认得。");
    narr("规矩需要有人一起守。他一个人刻石板，刻了半辈子。他的规矩只有他自己守，所以它没法成立。");
    addN("N_silent_echo_jurgen");
    echo("【回响 · 规矩在语言之外】尤尔根的‘规矩’要求共同实践。沉默者一个人刻石板，刻了半辈子。他的规矩只有他自己守，所以它没法成立。");
    N.final.M00();
  }});
  if(G.cleared.lina)o.push({label:S.finalEchoUsed.lina?"（已用莉娜的“真的”说过话）":"用莉娜的“真的”对他说话",disabled:!!S.finalEchoUsed.lina,action:function(){
    push(last);newSeg();you("真的，我看见你站在这里了。");
    S.finalEchoUsed.lina=true;
    narr("他的头侧了一下，像在听一个很远的、他几乎要忘记的声音。");
    narr("然后他慢慢转回去，背对着你。");
    narr("他没有笑，也没有说话。但他侧头的那一下，比说话更清楚。");
    narr("“真的”需要有人听。他讲了半辈子村史，最后没有人听了。他的“真的”没有听众，就退出了语言。");
    addN("N_silent_echo_lina");
    echo("【回响 · 真的在语言之外】莉娜的‘真的’要求有人听。沉默者讲了半辈子村史，最后没有人听了。他的‘真的’没有听众，就退出了语言。");
    N.final.M00();
  }});
  o.push({label:"沉默，和他一起站着",action:function(){
    push(last);newSeg();
    narr("你没有说话。");
    narr("你走到他旁边，和他一起站着，看那块石板。");
    narr("石板很旧。表面有一层薄灰，灰下面隐约有刻痕，被磨得很浅。");
    narr("太阳在头顶。你站了一会儿，觉得脚有点酸。他站着，一动不动，像已经站了很久，像还要站很久。");
    narr("你开始注意一些很小的事：风从哪个方向来，灰尘落在石板上是什么声音，他的呼吸有没有起伏。");
    narr("他没有呼吸的起伏。或者说，太小了，你看不出来。");
    narr("你们站了很久。久到你忘了自己在等什么。");
    narr("然后他转头看了你一眼。");
    narr("很快。又转回去。");
    narr("但那一眼你看清了：他不是空的。他是被什么截断了。像一句话说到一半，刀滑了一下。");
    addE("F_E01");addS(2);addT(1);
    N.final.M01();
  }});
  opts(o);diagBtn();
};
N.final.hot=function(id){

N.final.M01=function(){
  last="M01";newSeg();
  if(!S.finalM01Intro){
    S.finalM01Intro=true;
    narr("你蹲下来，看石板背面的刻痕。");
    narr("刻痕很浅，被雨水磨过很多年。要凑得很近，才能看出那是字。");
    narr("不是完整的句子。是名字，日期，几件旧事。刻得很工整，一笔一画，像一份不肯交出去的账。");
    narr("你注意到，每一段刻痕的最后，都断在一个地方。不是句号。是断。像刻字的人写到一半，刀停了。");
    narr("你把手指放上去。石头是凉的。凉得很均匀，像它已经凉了很多年。");
  }
  var o=[];
  o.push({label:(S.finalRead&&S.finalRead.R1)?"再读一遍第一段刻痕":"读第一段刻痕",action:function(){N.final.R1();}});
  o.push({label:(S.finalRead&&S.finalRead.R2)?"再读一遍第二段刻痕":"读第二段刻痕",action:function(){N.final.R2();}});
  o.push({label:(S.finalRead&&S.finalRead.R3)?"再读一遍第三段刻痕":"读第三段刻痕",action:function(){N.final.R3();}});
  o.push({label:(S.finalRead&&S.finalRead.R4)?"再读一遍第四段刻痕":"读第四段刻痕",action:function(){N.final.R4();}});
  var readAny=S.ev.indexOf("F_E02")>=0||S.ev.indexOf("F_E03")>=0||S.ev.indexOf("F_E04")>=0||S.ev.indexOf("F_E05")>=0;
  o.push({label:"问他：“这些刻痕，是你刻的？”",action:function(){
    push(last);newSeg();
    if(!readAny){
      you("这些刻痕，是你刻的？");
      narr("他没有动。");
      narr("你忽然觉得，这个问题问得太早了。他还没有理由回答你。");
      narr("你站在石板前，觉得自己像一个来早了的人。");
      addS(-1);N.final.M01();
    }else{
      you("这些，是你刻的。你刻到一半，停下来了。");
      narr("他慢慢抬起手，指向石板上一个位置。");
      narr("那是他最后一次刻字的地方。");
      narr("你凑过去看。那里刻着一个没有写完的句子——");
      narr("“……那天以后，我就不知道该——”");
      narr("刻痕到这里断了。后面是一道很长的空白。");
      narr("空白很干净。干净得像有人用袖子擦过，擦了很多遍。");
      addE("F_E06");N.final.M02();
    }
  }});
  o.push({label:"不读了，直接问他“你为什么不说话”",action:function(){
    push(last);newSeg();
    you("你为什么不说话？");
    narr("他没有动。");
    narr("风从广场穿过，把石板上的薄灰吹起来一层。");
    narr("你看着那层灰落回去，忽然觉得自己问错了。");
    narr("他不是不说话。他是没有可以说话的地方。");
    narr("这个念头让你很不舒服。你说不清为什么。");
    addS(-2);N.final.M01();
  }});
  if(S.ev.indexOf("F_E06")>=0)o.push({label:"【继续】他转过身来。",special:true,action:function(){N.final.M02();}});
  opts(o);diagBtn();
};
N.final.R1=function(){last="R1";newSeg();if(!S.finalRead)S.finalRead={};var first=!S.finalRead.R1;S.finalRead.R1=true;addE("F_E02");narr("“……那年饥荒，磨坊的汉斯把最后半袋面粉分给了孩子。他自己喝了三天稀汤。”");narr("刻痕到这里断了。后面是一片空白，没有字。");if(first){narr("你想起汉斯攥着面粉袋的样子。你不知道他当年分面粉的时候，是不是也这样说。");}else{narr("你又想起汉斯。这次想起的是他把面粉袋往桌上一搁，说“我看它装满了”。");}N.final.M01();};
N.final.R2=function(){last="R2";newSeg();if(!S.finalRead)S.finalRead={};var first=!S.finalRead.R2;S.finalRead.R2=true;addE("F_E03");narr("“……铁匠的师父在火里没出来。尤尔根那年在铁匠铺里关了三天，出来的时候，手上多了五道伤。”");narr("刻痕到这里断了。后面是一片空白，没有字。");if(first){narr("你想起尤尔根锤柄上的五道划痕。原来那不是他自己刻的。原来那五道伤，比锤柄更早。");}else{narr("你又想起尤尔根。这次想起的是他把锤柄翻了个面，不让你看。");}N.final.M01();};
N.final.R3=function(){last="R3";newSeg();if(!S.finalRead)S.finalRead={};var first=!S.finalRead.R3;S.finalRead.R3=true;addE("F_E04");narr("“……玛尔塔的墙第一次裂的时候，她还没老。她一个人搬了三天石头，把墙补上了。”");narr("刻痕到这里断了。后面还有一小段，只刻了一个字的一半，像刀滑了一下。");if(first){narr("你想起玛尔塔摸着墙说“轻一点”。原来那堵墙，裂过不止一次。原来她一个人补了不止一次。");}else{narr("你又想起玛尔塔。这次想起的是她蹲在墙边，掌心贴着新补的那块，像在听里面还有没有声音。");}N.final.M01();};
N.final.R4=function(){last="R4";newSeg();if(!S.finalRead)S.finalRead={};var first=!S.finalRead.R4;S.finalRead.R4=true;addE("F_E05");narr("“……莉娜的母亲是村子里最后一个会讲故事的。她走的那天，莉娜还不会说‘真的’。”");narr("刻痕到这里断了。后面是一道很深的划痕，不像刻字，像有人用刀划了一下。");if(first){narr("你想起莉娜说“真的”的时候，眼睛会亮。原来那个词，是从她母亲那里来的。原来她学会说“真的”的那一天，已经没有人可以听她说了。");}else{narr("你又想起莉娜。这次想起的是她低头蹭粉笔灰，说“她走的那天，我还不会说‘真的’”。");}N.final.M01();};

N.final.M02=function(){
  last="M02";newSeg();
  narr("沉默者转过身来，第一次正面看着你。");
  narr("他的眼睛不空。里面有东西，只是被压得很深。像水底的石头，你看得见它的形状，但捞不上来。");
  narr("他开口了。声音很轻，像很久没用过。");
  say("所有词都被用过了。");
  say("但没一个词是我的。");
  narr("他伸出手，掌心向上。");
  say("给我一个词。");
  narr("他的手很干。掌纹很深，像石板上那些刻痕。");
  warn("你可以给他一个词，也可以不给。");
  warn("给出去，就收不回来了。");
  var o=[];

  o.push({label:G.cleared.marta?"给他「疼」（玛尔塔的“疼”）":"给他「疼」（未达成玛尔塔章的「准确理解」，不可选）",disabled:!G.cleared.marta,action:function(){
    push(last);newSeg();
    narr("你把“疼”放在他掌心。");narr("他看着这个词，看了很久。");say("疼……");narr("他试着用了一下。");say("石板……疼。");
    narr("他说得很标准，很正确。像任何一个人会说的一样。");
    narr("然后他点了点头，转身，在石板上开始刻字。刻得很工整，一笔一画，和他当记录员时一样。");
    narr("太阳升到头顶，又慢慢偏西。他刻了一整天。");
    narr("人们开始从他面前经过。石板被填满了。村史继续。");
    narr("村庄重新学会了说话。");narr("没有人记得那个不说话的人。");
    narr("你站在广场上，听见有人说“石板疼”，没有人觉得奇怪。");
    narr("你也说了一句“石板疼”。你说得很自然。");
    finish("silent_word_public");
  }});
  o.push({label:G.cleared.hans?"给他「我知道」（汉斯的“我知道”）":"给他「我知道」（未达成汉斯章的「准确理解」，不可选）",disabled:!G.cleared.hans,action:function(){
    push(last);newSeg();
